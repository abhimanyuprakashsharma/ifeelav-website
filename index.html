<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFEELAV | Curated by Abhimanyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #C5A059; }
        
        /* NO COPY / NO SELECT ZONE */
        .no-select { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        
        body { transition: background 0.3s ease; font-family: 'Inter', sans-serif; background: #ffffff; color: #1a1a1a; overflow-x: hidden; }
        body.dark { background: #050505; color: #f5f5f5; }

        .brand-font { font-family: 'Cinzel', serif; }
        .gold-text { color: var(--gold); }

        /* Responsive Glass Panels */
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0,0,0,0.1); transition: 0.3s; }
        body.dark .glass-panel { background: rgba(20, 20, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }

        /* Buttons */
        .cat-btn { background: #f9f9f9; border: 1px solid #eee; transition: 0.3s; cursor: pointer; }
        body.dark .cat-btn { background: #151515; border-color: #333; color: #ddd; }
        .cat-btn:active { transform: scale(0.95); }

        /* Main Card */
        .premium-card { 
            height: 65vh; width: 100%; max-width: 400px; 
            border-radius: 30px; overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            position: relative; cursor: pointer;
        }

        /* Overlays */
        #detailOverlay { position: fixed; inset: 0; z-index: 50; background: white; transform: translateY(100%); transition: transform 0.3s ease; overflow-y: auto; }
        body.dark #detailOverlay { background: #000; }
        #detailOverlay.active { transform: translateY(0); }

        #authModal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; }
        #authModal.active { display: flex; }

        /* Search Dropdown */
        #searchDropdown { position: absolute; top: 120%; left: 0; width: 100%; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 40; display: none; max-height: 300px; overflow-y: auto; }
        body.dark #searchDropdown { background: #1a1a1a; border: 1px solid #333; }
        #searchDropdown.active { display: block; }
    </style>
</head>
<body class="dark"> <div class="fixed top-0 left-0 w-full z-40 p-4 flex justify-between items-center bg-white/90 dark:bg-black/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
        <div class="text-xl font-bold brand-font gold-text no-select cursor-pointer" onclick="location.reload()">IFEELAV</div>
        <div class="flex gap-2 items-center">
            <button onclick="window.toggleDarkMode()" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center">🌓</button>
            <div class="relative">
                <input type="text" id="searchInput" oninput="window.handleTyping(event)" placeholder="Search..." class="glass-panel rounded-full px-4 py-2 w-28 md:w-64 text-sm outline-none">
                <div id="searchDropdown"></div>
            </div>
            <button onclick="window.toggleAuthModal()" class="glass-panel w-10 h-10 rounded-full overflow-hidden relative border border-transparent hover:border-[#C5A059]">
                <img id="headerAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Guest" class="w-full h-full object-cover">
            </button>
        </div>
    </div>

    <div id="mainContent" class="relative z-10 min-h-screen flex flex-col items-center justify-center pt-20 px-4 pb-20">
        
        <div id="step1" class="text-center w-full max-w-4xl fade-in">
            <h1 class="brand-font text-5xl md:text-8xl gold-text mb-4 no-select tracking-tighter">IFEELAV</h1>
            <p class="text-xs md:text-sm text-gray-500 mb-10 uppercase tracking-[0.3em] no-select">Curated by Abhimanyu</p>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="window.selectRegion('hi', 'Bollywood')" class="cat-btn p-6 rounded-2xl font-bold text-sm md:text-lg">BOLLYWOOD</button>
                <button onclick="window.selectRegion('en', 'Hollywood')" class="cat-btn p-6 rounded-2xl font-bold text-sm md:text-lg">HOLLYWOOD</button>
                <button onclick="window.selectRegion('ja', 'Anime')" class="cat-btn p-6 rounded-2xl font-bold text-sm md:text-lg">ANIME</button>
                <button onclick="window.selectRegion('ko', 'K-Drama')" class="cat-btn p-6 rounded-2xl font-bold text-sm md:text-lg">K-DRAMA</button>
            </div>
        </div>

        <div id="step2" class="hidden text-center w-full max-w-3xl fade-in">
            <h1 id="regionTitle" class="brand-font text-3xl gold-text mb-8 no-select"></h1>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <button onclick="window.startApp('28')" class="glass-panel p-4 rounded-xl font-bold">Action</button>
                <button onclick="window.startApp('35')" class="glass-panel p-4 rounded-xl font-bold">Comedy</button>
                <button onclick="window.startApp('18')" class="glass-panel p-4 rounded-xl font-bold">Drama</button>
                <button onclick="window.startApp('9648')" class="glass-panel p-4 rounded-xl font-bold">Mystery</button>
                <button onclick="window.startApp('10765')" class="glass-panel p-4 rounded-xl font-bold">Sci-Fi</button>
            </div>
            <button onclick="history.back()" class="text-gray-400 text-xs uppercase tracking-widest p-4">← Go Back</button>
        </div>

        <div id="swipeStep" class="hidden w-full flex flex-col items-center">
            <div id="showCard" onclick="window.openCurrentCard()" class="premium-card relative">
                <img id="poster" src="" class="w-full h-full object-cover">
                <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black via-black/60 to-transparent text-white">
                    <h2 id="cardTitle" class="brand-font text-3xl leading-none mb-2 no-select"></h2>
                    <p id="cardMeta" class="text-xs opacity-70 font-sans"></p>
                </div>
            </div>
            <div class="flex gap-8 mt-8">
                <button onclick="window.handleAction('pass')" class="w-16 h-16 rounded-full glass-panel flex items-center justify-center text-2xl hover:bg-red-500/10 transition">✕</button>
                <button onclick="window.handleAction('smash')" class="w-16 h-16 rounded-full bg-[#C5A059] text-white text-3xl shadow-xl hover:scale-110 transition">♥</button>
            </div>
        </div>
    </div>

    <div class="w-full text-center py-8 opacity-60 text-xs no-select">
        <p class="mb-2 tracking-widest uppercase">Designed & Curated by Abhimanyu</p>
        <a href="https://instagram.com/your_id" target="_blank" class="text-2xl hover:text-[#C5A059] transition"><i class="fab fa-instagram"></i></a>
    </div>

    <div id="detailOverlay">
        <button onclick="window.closeDetails()" class="fixed top-6 right-6 z-[60] bg-black/60 text-white w-10 h-10 rounded-full flex items-center justify-center">✕</button>
        <div id="detailContent"></div>
    </div>

    <div id="authModal">
        <div class="bg-white dark:bg-[#111] p-8 rounded-3xl w-full max-w-sm relative shadow-2xl border border-gray-100 dark:border-gray-800">
            <button onclick="window.toggleAuthModal()" class="absolute top-4 right-4 text-gray-400">✕</button>
            
            <div id="authForms">
                <h2 class="brand-font text-2xl mb-4 gold-text text-center">Join The Vault</h2>
                <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-3 rounded-xl border dark:bg-[#222] dark:border-[#333] outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 rounded-xl border dark:bg-[#222] dark:border-[#333] outline-none">
                <button onclick="window.handleLogin()" class="w-full bg-[#C5A059] text-white py-3 rounded-xl font-bold mb-3">Login</button>
                <button onclick="window.handleSignup()" class="w-full border border-[#C5A059] text-[#C5A059] py-3 rounded-xl font-bold">Create Account</button>
            </div>

            <div id="userProfile" class="hidden text-center">
                <div class="w-24 h-24 mx-auto mb-4 rounded-full overflow-hidden border-4 border-[#C5A059]">
                    <img id="profileAvatar" src="" class="w-full h-full object-cover">
                </div>
                <h3 id="userEmailDisplay" class="font-bold mb-2 text-lg">User</h3>
                <p class="text-xs text-gray-500 mb-6">MEMBER</p>
                
                <button onclick="window.resetPassword()" class="w-full bg-gray-100 dark:bg-[#222] text-gray-600 dark:text-gray-300 py-3 rounded-xl font-bold mb-3 text-sm">Change Password</button>
                <button onclick="window.handleLogout()" class="w-full bg-red-500/10 text-red-500 py-3 rounded-xl font-bold text-sm">Log Out</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoCZuJ4tGdwmFuz8y-_tc5phvfbn2oi1A",
            authDomain: "ifeelav-app.firebaseapp.com",
            projectId: "ifeelav-app",
            storageBucket: "ifeelav-app.firebasestorage.app",
            messagingSenderId: "1060067685106",
            appId: "1:1060067685106:web:4ba1523ee066af4633966b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- GLOBAL STATE ---
        let shows = [];
        let index = 0;
        let selectedLang = '';
        let searchTimer;
        let currentTvId = null;

        // --- AUTH LOGIC ---
        window.handleLogin = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).then(() => window.toggleAuthModal()).catch(e => alert(e.message));
        window.handleSignup = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).then(() => window.toggleAuthModal()).catch(e => alert(e.message));
        window.handleLogout = () => signOut(auth);
        window.resetPassword = () => {
            const email = auth.currentUser.email;
            sendPasswordResetEmail(auth, email).then(() => alert("Password reset email sent to " + email)).catch(e => alert(e.message));
        };

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('authForms').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email.split('@')[0];
                const av = `https://api.dicebear.com/7.x/adventurer/svg?seed=${user.uid}`;
                document.getElementById('headerAvatar').src = av;
                document.getElementById('profileAvatar').src = av;
            } else {
                document.getElementById('authForms').classList.remove('hidden');
                document.getElementById('userProfile').classList.add('hidden');
                document.getElementById('headerAvatar').src = "https://api.dicebear.com/7.x/adventurer/svg?seed=Guest";
            }
        });

        // --- NAVIGATION & HISTORY (BACK BUTTON FIX) ---
        window.selectRegion = (lang, name) => {
            selectedLang = lang;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('regionTitle').innerText = name;
            history.pushState({step: 2}, "");
        };

        window.startApp = (gid) => {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('swipeStep').classList.remove('hidden');
            fetchShows(`/api/getShows?genre=${gid}&lang=${selectedLang}`);
            history.pushState({step: 3}, "");
        };

        window.addEventListener('popstate', (e) => {
            if(!e.state) {
                 location.reload(); 
            } else if(e.state.step === 2) {
                document.getElementById('swipeStep').classList.add('hidden');
                document.getElementById('detailOverlay').classList.remove('active');
                document.getElementById('step2').classList.remove('hidden');
            } else if(e.state.step === 3) {
                document.getElementById('detailOverlay').classList.remove('active');
            }
        });

        // --- SHOWS LOGIC ---
        async function fetchShows(url) {
            const res = await fetch(url);
            const data = await res.json();
            shows = data.results.filter(s => s.poster_path);
            index = 0;
            renderCard();
        }

        function renderCard() {
            if(!shows[index]) return;
            const s = shows[index];
            document.getElementById('cardTitle').innerText = s.name || s.original_name;
            document.getElementById('cardMeta').innerText = `Rating: ${s.vote_average.toFixed(1)} • ${s.first_air_date ? s.first_air_date.split('-')[0] : 'N/A'}`;
            document.getElementById('poster').src = `https://image.tmdb.org/t/p/w780${s.poster_path}`;
        }

        window.handleAction = (type) => {
            const card = document.getElementById('showCard');
            card.style.transform = type === 'smash' ? 'translateX(100%)' : 'translateX(-100%)';
            card.style.opacity = '0';
            setTimeout(() => { index++; card.style.transform = ''; card.style.opacity = '1'; renderCard(); }, 300);
        };

        window.openCurrentCard = () => { if(shows[index]) window.openDetails(shows[index].id); }

        // --- DETAILS, SEASONS & EPISODES ---
        window.openDetails = async (id) => {
            currentTvId = id;
            document.getElementById('searchDropdown').classList.remove('active');
            document.getElementById('detailOverlay').classList.add('active');
            history.pushState({step: 'details'}, "");
            
            const res = await fetch(`/api/getDetails?id=${id}`);
            const data = await res.json();
            
            // Build Season Selectors
            let seasonHTML = '';
            if(data.seasons && data.seasons.length > 0) {
                seasonHTML = `<div class="flex gap-2 overflow-x-auto pb-2 mb-4">` + 
                    data.seasons.filter(s => s.season_number > 0).map(s => 
                        `<button onclick="window.loadEpisodes(${s.season_number})" class="shrink-0 px-4 py-2 rounded-lg bg-gray-100 dark:bg-zinc-800 text-sm font-bold whitespace-nowrap hover:bg-[#C5A059] hover:text-white transition">Season ${s.season_number}</button>`
                    ).join('') + `</div>`;
            }

            // Screenshots
            let shotsHTML = '';
            if(data.images && data.images.backdrops) {
                shotsHTML = `<div class="flex gap-2 overflow-x-auto pb-2 mb-6">` + 
                    data.images.backdrops.slice(0, 5).map(img => 
                        `<img src="https://image.tmdb.org/t/p/w500${img.file_path}" class="h-32 rounded-lg object-cover">`
                    ).join('') + `</div>`;
            }

            document.getElementById('detailContent').innerHTML = `
                <div class="h-[50vh] relative">
                    <img src="https://image.tmdb.org/t/p/original${data.backdrop_path || data.poster_path}" class="w-full h-full object-cover">
                    <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-white dark:from-black to-transparent">
                        <h1 class="brand-font text-3xl md:text-5xl gold-text">${data.name}</h1>
                        <p class="text-sm font-bold mt-2">⭐ ${data.vote_average.toFixed(1)}/10 (TMDB)</p>
                    </div>
                </div>
                <div class="p-6 max-w-4xl mx-auto">
                    <p class="opacity-80 leading-relaxed mb-6">${data.overview}</p>
                    
                    <h3 class="font-bold mb-3 uppercase tracking-widest text-xs opacity-50">Gallery</h3>
                    ${shotsHTML}

                    <h3 class="font-bold mb-3 uppercase tracking-widest text-xs opacity-50">Select Season</h3>
                    ${seasonHTML}
                    
                    <div id="episodeList" class="grid gap-3 mt-4">
                        <p class="text-sm opacity-50 italic">Select a season to view episodes...</p>
                    </div>
                </div>
            `;
            
            // Auto load Season 1
            if(data.seasons && data.seasons.length > 0) window.loadEpisodes(1);
        };

        window.loadEpisodes = async (seasonNum) => {
            const list = document.getElementById('episodeList');
            list.innerHTML = '<p class="text-sm opacity-50 animate-pulse">Loading Episodes...</p>';
            
            try {
                const res = await fetch(`/api/getEpisodes?id=${currentTvId}&season=${seasonNum}`);
                const data = await res.json();
                
                if(data.episodes) {
                    list.innerHTML = data.episodes.map(ep => `
                        <div class="glass-panel p-4 rounded-xl flex flex-col gap-2">
                            <div class="flex justify-between items-start">
                                <span class="text-[#C5A059] font-bold text-sm">E${ep.episode_number}</span>
                                <span class="text-xs bg-gray-200 dark:bg-zinc-700 px-2 py-1 rounded">⭐ ${ep.vote_average.toFixed(1)}</span>
                            </div>
                            <h4 class="font-bold text-md">${ep.name}</h4>
                            <p class="text-xs opacity-60 line-clamp-2">${ep.overview || 'No description.'}</p>
                            <p class="text-[10px] opacity-40 mt-1">${ep.runtime ? ep.runtime + ' min' : ''}</p>
                        </div>
                    `).join('');
                }
            } catch(e) { list.innerHTML = 'Error loading episodes'; }
        };

        window.closeDetails = () => history.back();

        // UTILS
        window.toggleDarkMode = () => document.body.classList.toggle('dark');
        window.toggleAuthModal = () => document.getElementById('authModal').classList.toggle('active');
        
        window.handleTyping = (e) => {
            const q = e.target.value; const dd = document.getElementById('searchDropdown');
            if(q.length < 2) { dd.classList.remove('active'); return; }
            clearTimeout(searchTimer);
            searchTimer = setTimeout(async () => {
                const res = await fetch(`/api/getShows?query=${q}`);
                const data = await res.json();
                dd.innerHTML = data.results.slice(0, 5).map(s => `
                    <div class="p-3 border-b dark:border-zinc-800 cursor-pointer flex gap-3 items-center hover:bg-black/5" onclick="window.openDetails(${s.id})">
                        <img src="https://image.tmdb.org/t/p/w92${s.poster_path}" class="w-10 h-14 object-cover rounded">
                        <div>
                            <span class="font-bold text-sm block">${s.name || s.original_name}</span>
                            <span class="text-xs opacity-50">${s.first_air_date ? s.first_air_date.split('-')[0] : ''}</span>
                        </div>
                    </div>`).join('');
                dd.classList.add('active');
            }, 300);
        };
    </script>
</body>
</html>
