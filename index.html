<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>IFEELAV | Curated by Abhimanyu</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root { --gold:#C5A059; }

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:'Inter',sans-serif;
background:#ffffff;
color:#1a1a1a;
overflow-x:hidden;
}

.brand-font{font-family:'Cinzel',serif;}
.gold-text{color:var(--gold);}

/* Container */
#mainContent{
width:100%;
max-width:1500px;
margin:auto;
padding:clamp(12px,4vw,40px);
padding-top:110px;
}

/* Navbar */
.navbar{
backdrop-filter:blur(12px);
}

/* Hero Banner */
.hero-slider{
position:relative;
width:100%;
height:clamp(320px,60vh,720px);
border-radius:28px;
overflow:hidden;
margin-bottom:30px;
}

.hero-slide{
position:absolute;
inset:0;
opacity:0;
transition:opacity 0.8s ease;
}

.hero-slide.active{opacity:1;}

.hero-slide img{
width:100%;
height:100%;
object-fit:cover;
}

.hero-overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,0.85),rgba(0,0,0,0.2));
}

/* OTT Rows */
.ott-row{margin-top:40px;}

.ott-scroll{
display:flex;
gap:16px;
overflow-x:auto;
scroll-snap-type:x mandatory;
}

.ott-scroll::-webkit-scrollbar{display:none;}

.poster-card{
min-width:clamp(130px,18vw,220px);
border-radius:16px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
flex-shrink:0;
scroll-snap-align:start;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.poster-card:hover{transform:scale(1.08);}

.poster-card img{
width:100%;
height:clamp(190px,28vw,340px);
object-fit:cover;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="fixed top-0 left-0 w-full z-50 navbar flex justify-between items-center bg-white/95 border-b px-6 py-4 shadow-sm">
<div class="text-xl font-bold brand-font gold-text cursor-pointer" onclick="location.reload()">IFEELAV</div>
<div class="flex gap-4 items-center">
<input type="text" placeholder="Search Shows..." class="border-b outline-none text-sm">
<button class="text-xl">❤️</button>
<button class="text-xl">👤</button>
</div>
</div>

<div id="mainContent">

<!-- ================= HOME (STEP1) ================= -->
<div id="step1">

<div class="text-center mb-10">
<h1 class="brand-font gold-text text-5xl md:text-7xl">IFEELAV</h1>
<p class="uppercase tracking-[0.4em] text-gray-500 mt-2 text-sm">Curated by Abhimanyu</p>
<p class="mt-4 text-gray-600 italic max-w-xl mx-auto">
“Discover stories that match your mood, not just your watchlist.”
</p>

<button onclick="openRegionSelector()" class="mt-8 bg-[#C5A059] text-white px-8 py-3 rounded-full font-bold shadow-lg hover:scale-105 transition">
Start Exploring ✨
</button>
</div>

<!-- HERO BANNER -->
<div id="heroSlider" class="hero-slider"></div>

<!-- OTT ROWS -->
<div class="ott-row">
<h2 class="brand-font gold-text text-2xl mb-3">Trending Now</h2>
<div id="trendingRow" class="ott-scroll"></div>
</div>

<div class="ott-row">
<h2 class="brand-font gold-text text-2xl mb-3">Top Rated</h2>
<div id="topRatedRow" class="ott-scroll"></div>
</div>

<div class="ott-row">
<h2 class="brand-font gold-text text-2xl mb-3">Hollywood</h2>
<div id="hollywoodRow" class="ott-scroll"></div>
</div>

<div class="ott-row">
<h2 class="brand-font gold-text text-2xl mb-3">Bollywood</h2>
<div id="bollywoodRow" class="ott-scroll"></div>
</div>

<div class="ott-row">
<h2 class="brand-font gold-text text-2xl mb-3">Anime</h2>
<div id="animeRow" class="ott-scroll"></div>
</div>

</div>

<!-- ================= REGION SELECTOR (STEP2) ================= -->
<div id="step2" class="hidden text-center max-w-3xl mx-auto">
<h1 id="regionTitle" class="brand-font gold-text text-3xl mb-6"></h1>
<div id="step2Grid" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8"></div>
</div>

</div>

<script type="module">

/* ===== SAFE API FETCH (Supports /api/Shows Capital) ===== */
async function fetchMixedContent(){
try{
let tvRes = await fetch('/api/Shows?type=tv');
let movieRes = await fetch('/api/Shows?type=movie');

if(!tvRes.ok || !movieRes.ok){
tvRes = await fetch('/api/shows?type=tv');
movieRes = await fetch('/api/shows?type=movie');
}

const tvData = await tvRes.json();
const movieData = await movieRes.json();

const tv = tvData.results || [];
const movies = movieData.results || [];

return [...tv,...movies]
.filter(i => i && (i.backdrop_path || i.poster_path))
.slice(0,30);

}catch(e){
console.error("API Error:",e);
return [];
}
}

/* ===== HERO BANNER INIT ===== */
function initHeroSlider(items){
const hero = document.getElementById('heroSlider');
hero.innerHTML = "";
let index = 0;

items.slice(0,6).forEach((item,i)=>{
const title = item.name || item.title || "Show";

const slide = document.createElement('div');
slide.className = 'hero-slide' + (i===0 ? ' active' : '');
slide.innerHTML = `
<img src="https://image.tmdb.org/t/p/original${item.backdrop_path || item.poster_path}">
<div class="hero-overlay"></div>
<div class="absolute bottom-8 left-6 text-white max-w-xl">
<h2 class="brand-font text-3xl md:text-5xl mb-2">${title}</h2>
<p class="text-sm mb-3">⭐ ${item.vote_average?.toFixed(1) || 'N/A'}</p>
</div>`;
hero.appendChild(slide);
});

setInterval(()=>{
const slides = document.querySelectorAll('.hero-slide');
if(!slides.length) return;
slides.forEach(s=>s.classList.remove('active'));
index = (index+1) % slides.length;
slides[index].classList.add('active');
},4500);
}

/* ===== ROW RENDER ===== */
function renderRow(id,list){
const container = document.getElementById(id);
container.innerHTML = "";
list.forEach(item=>{
if(!item.poster_path) return;
const card = document.createElement('div');
card.className = 'poster-card';
card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${item.poster_path}">`;
container.appendChild(card);
});
}

/* ===== LOAD HOMEPAGE ===== */
async function loadHomepage(){
const data = await fetchMixedContent();
if(!data.length) return;

initHeroSlider(data);
renderRow('trendingRow',data);
renderRow('topRatedRow',[...data].sort((a,b)=>b.vote_average-a.vote_average));
renderRow('hollywoodRow',data.filter(i=>i.original_language==='en'));
renderRow('bollywoodRow',data.filter(i=>i.original_language==='hi'));
renderRow('animeRow',data.filter(i=>i.original_language==='ja'));
}

/* ===== REGION SELECTOR (FINAL NO ALERT VERSION) ===== */
window.openRegionSelector = () => {
document.getElementById('step1').classList.add('hidden');
document.getElementById('step2').classList.remove('hidden');
document.getElementById('regionTitle').innerText = "Choose Your Region";

document.getElementById('step2Grid').innerHTML = `
<button onclick="selectRegion('en','Hollywood')" class="p-4 rounded-xl border font-bold">
Hollywood 🌎
</button>

<button onclick="selectRegion('hi','Bollywood')" class="p-4 rounded-xl border font-bold">
Bollywood 🇮🇳
</button>

<button onclick="selectRegion('ja','Anime')" class="p-4 rounded-xl border font-bold">
Anime 🇯🇵
</button>

<button onclick="selectRegion('ko','K-Drama')" class="p-4 rounded-xl border font-bold">
K-Drama 🇰🇷
</button>
`;
};

/* ===== REAL FLOW (NO POPUP, NO ALERT) ===== */
window.selectRegion = (lang,name)=>{
console.log("Selected:", name, lang);

/* Next step integration point with your original app */
document.getElementById('step2').classList.add('hidden');

/* If your original swipe/step3 exists it will handle from here */
};

loadHomepage();

</script>
</body>
</html>
