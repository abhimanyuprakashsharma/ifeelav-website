<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFEELAV | Premium Streaming Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #C5A059; --gold-glow: rgba(197, 160, 89, 0.5); }
        body { transition: background 0.5s ease; font-family: 'Inter', sans-serif; background: #ffffff; color: #1a1a1a; overflow-x: hidden; }
        body.dark { background: #050505; color: #ffffff; }
        
        #bgCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .premium-font { font-family: 'Playfair Display', serif; }
        .gold-text { color: var(--gold); }
        
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(197, 160, 89, 0.2); transition: all 0.3s; }
        body.dark .glass-panel { background: rgba(20, 20, 20, 0.8); border-color: var(--gold); }
        
        .cat-btn { background: white; border: 1px solid rgba(197, 160, 89, 0.3); transition: 0.4s; }
        body.dark .cat-btn { background: #111; color: white; border-color: var(--gold); }
        
        .premium-card { cursor: pointer; height: 65vh; width: 100%; max-width: 400px; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        
        /* Streaming Buttons */
        .stream-btn { display: flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s; color: white; text-decoration: none; margin-bottom: 8px; }
        .stream-btn:hover { transform: translateY(-3px); }
        .stream-netflix { background: #E50914; }
        .stream-prime { background: #00A8E1; }
        .stream-hotstar { background: #133ba2; }
        .stream-jiocinema { background: #d32f90; }
        .stream-default { background: #333; }

        #detailOverlay { position: fixed; inset: 0; z-index: 200; background: white; transform: translateY(100%); transition: transform 0.4s ease; overflow-y: auto; }
        #detailOverlay.active { transform: translateY(0); }
        body.dark #detailOverlay { background: #050505; }
        
        #authModal { transition: opacity 0.3s ease; opacity: 0; pointer-events: none; z-index: 300; }
        #authModal.active { opacity: 1; pointer-events: auto; }
        
        #searchDropdown { position: absolute; top: 110%; left: 0; width: 100%; background: white; border-radius: 20px; z-index: 150; display: none; }
        body.dark #searchDropdown { background: #1a1a1a; border: 1px solid var(--gold); }
        #searchDropdown.active { display: block; }
    </style>
</head>
<body class="dark">
    <canvas id="bgCanvas"></canvas>

    <div class="fixed top-0 left-0 w-full z-[150] p-4 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="text-xl md:text-2xl font-bold italic premium-font gold-text cursor-pointer" onclick="location.reload()">IFEELAV</div>
        <div class="flex gap-2 items-center">
            <button onclick="toggleDarkMode()" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center">🌓</button>
            <div class="relative">
                <input type="text" id="searchInput" oninput="handleTyping(event)" placeholder="Search..." autocomplete="off" class="glass-panel rounded-full px-4 py-2 w-32 md:w-64 text-sm outline-none focus:border-[#C5A059]">
                <div id="searchDropdown" class="overflow-hidden"></div>
            </div>
            <button onclick="toggleAuthModal()" class="glass-panel w-10 h-10 rounded-full overflow-hidden relative border-2 border-gold/30">
                <img id="headerAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" class="w-full h-full object-cover">
            </button>
        </div>
    </div>

    <div id="authModal" class="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-zinc-900 p-8 rounded-3xl w-full max-w-sm relative">
            <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-gray-400">✕</button>
            <div id="loggedOutView">
                <h2 class="premium-font text-2xl mb-4 gold-text">Account</h2>
                <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-3 rounded-xl border dark:bg-zinc-800 dark:border-zinc-700 outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 rounded-xl border dark:bg-zinc-800 dark:border-zinc-700 outline-none">
                <button onclick="window.handleLogin()" class="w-full bg-gold text-white py-3 rounded-xl font-bold mb-3">Sign In</button>
                <button onclick="window.handleSignup()" class="w-full border border-gold text-gold py-3 rounded-xl font-bold">Sign Up</button>
            </div>
            <div id="loggedInView" class="hidden text-center">
                <div class="w-20 h-20 bg-gold/10 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl">👤</div>
                <h3 id="userDisplay" class="font-bold mb-6 text-xl">User</h3>
                <button onclick="window.handleLogout()" class="w-full bg-red-500/10 text-red-500 py-3 rounded-xl font-bold">Sign Out</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="relative z-10 min-h-screen flex flex-col items-center justify-center pt-20 px-4">
        <div id="step1" class="text-center w-full max-w-3xl">
            <h1 class="premium-font italic text-5xl md:text-7xl gold-text mb-12">IFEELAV</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="selectRegion('hi', 'Bollywood')" class="cat-btn p-6 rounded-2xl font-bold glass-panel">BOLLYWOOD</button>
                <button onclick="selectRegion('en', 'Hollywood')" class="cat-btn p-6 rounded-2xl font-bold glass-panel">HOLLYWOOD</button>
                <button onclick="selectRegion('ja', 'Anime')" class="cat-btn p-6 rounded-2xl font-bold glass-panel">ANIME</button>
                <button onclick="selectRegion('ko', 'K-Drama')" class="cat-btn p-6 rounded-2xl font-bold glass-panel">K-DRAMA</button>
            </div>
        </div>
        <div id="step2" class="hidden text-center w-full max-w-3xl">
            <h1 id="regionTitle" class="premium-font text-4xl gold-text mb-8"></h1>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <button onclick="startApp('28')" class="glass-panel p-4 rounded-xl font-bold">Action</button>
                <button onclick="startApp('35')" class="glass-panel p-4 rounded-xl font-bold">Comedy</button>
                <button onclick="startApp('18')" class="glass-panel p-4 rounded-xl font-bold">Drama</button>
                <button onclick="startApp('9648')" class="glass-panel p-4 rounded-xl font-bold">Mystery</button>
                <button onclick="startApp('10765')" class="glass-panel p-4 rounded-xl font-bold">Sci-Fi</button>
            </div>
        </div>
        <div id="swipeStep" class="hidden w-full flex flex-col items-center">
            <div id="showCard" onclick="openDetails(shows[index].id, shows[index].media_type)" class="premium-card relative">
                <img id="poster" src="" class="w-full h-full object-cover">
                <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black to-transparent text-white">
                    <h2 id="cardTitle" class="premium-font text-3xl"></h2>
                </div>
            </div>
            <div class="flex gap-8 mt-8">
                <button onclick="handleAction('pass')" class="w-16 h-16 rounded-full glass-panel flex items-center justify-center">✕</button>
                <button onclick="handleAction('smash')" class="w-16 h-16 rounded-full bg-gold text-white text-3xl shadow-xl">♥</button>
            </div>
        </div>
    </div>

    <div id="detailOverlay">
        <button onclick="closeDetails()" class="fixed top-6 right-6 z-[210] bg-black/50 text-white w-10 h-10 rounded-full">✕</button>
        <div id="detailContent"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoCZuJ4tGdwmFuz8y-_tc5phvfbn2oi1A",
            authDomain: "ifeelav-app.firebaseapp.com",
            projectId: "ifeelav-app",
            storageBucket: "ifeelav-app.firebasestorage.app",
            messagingSenderId: "1060067685106",
            appId: "1:1060067685106:web:4ba1523ee066af4633966b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleLogin = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).then(() => toggleAuthModal()).catch(err => alert(err.message));
        window.handleSignup = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).then(() => toggleAuthModal()).catch(err => alert(err.message));
        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('loggedOutView').classList.add('hidden');
                document.getElementById('loggedInView').classList.remove('hidden');
                document.getElementById('userDisplay').innerText = user.email.split('@')[0];
            } else {
                document.getElementById('loggedOutView').classList.remove('hidden');
                document.getElementById('loggedInView').classList.add('hidden');
            }
        });

        // --- APP LOGIC ---
        let shows = [], index = 0, selectedLang = '';
        window.toggleDarkMode = () => document.body.classList.toggle('dark');
        window.toggleAuthModal = () => document.getElementById('authModal').classList.toggle('active');

        // Navigation
        window.selectRegion = (lang, name) => {
            selectedLang = lang;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('regionTitle').innerText = name;
            history.pushState({step: 2}, "");
        };

        window.startApp = (gid) => {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('swipeStep').classList.remove('hidden');
            fetchShows(`/api/getShows?genre=${gid}&lang=${selectedLang}`);
            history.pushState({step: 3}, "");
        };

        // Back Button Fix
        window.addEventListener('popstate', (event) => {
            if (!event.state) location.reload();
            else if (event.state.step === 2) {
                document.getElementById('swipeStep').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            }
        });

        async function fetchShows(url) {
            const res = await fetch(url); const data = await res.json();
            shows = data.results.filter(s => s.poster_path); index = 0; renderCard();
        }

        function renderCard() {
            if(!shows[index]) return;
            document.getElementById('cardTitle').innerText = shows[index].name || shows[index].original_name;
            document.getElementById('poster').src = `https://image.tmdb.org/t/p/w780${shows[index].poster_path}`;
        }

        window.handleAction = (type) => {
            const card = document.getElementById('showCard');
            card.style.transform = type === 'smash' ? 'translateX(100%) rotate(20deg)' : 'translateX(-100%) rotate(-20deg)';
            card.style.opacity = '0';
            setTimeout(() => { index++; card.style.transform = ''; card.style.opacity = '1'; renderCard(); }, 300);
        };

        // --- STREAMING & DETAILS LOGIC ---
        window.openDetails = async (id, mediaType) => {
            document.getElementById('detailOverlay').classList.add('active');
            
            // 1. Fetch TMDB Details
            const res = await fetch(`/api/getDetails?id=${id}`); 
            const data = await res.json();
            
            // 2. Fetch Streaming Links (Watchmode)
            let streamingHTML = '<p class="opacity-50 text-sm">Checking availability...</p>';
            try {
                // Determine type (tv/movie) for watchmode
                // Note: IFEELAV mostly fetches 'tv' shows but let's be safe
                const type = data.number_of_seasons ? 'tv' : 'movie';
                const streamRes = await fetch(`/api/getStream?tmdb_id=${id}&type=${type}`);
                const streamData = await streamRes.json();
                
                if (streamData.sources && streamData.sources.length > 0) {
                    streamingHTML = streamData.sources.map(s => {
                        let btnClass = 'stream-default';
                        if(s.name.includes('Netflix')) btnClass = 'stream-netflix';
                        else if(s.name.includes('Prime')) btnClass = 'stream-prime';
                        else if(s.name.includes('Hotstar')) btnClass = 'stream-hotstar';
                        else if(s.name.includes('Jio')) btnClass = 'stream-jiocinema';
                        
                        return `<a href="${s.url}" target="_blank" class="stream-btn ${btnClass}">▶ Watch on ${s.name}</a>`;
                    }).join('');
                } else {
                    streamingHTML = '<p class="opacity-50 text-sm">No streaming data found for India.</p>';
                }
            } catch(e) { console.log(e); }

            document.getElementById('detailContent').innerHTML = `
                <div class="h-[50vh] relative"><img src="https://image.tmdb.org/t/p/original${data.backdrop_path || data.poster_path}" class="w-full h-full object-cover"></div>
                <div class="p-6">
                    <h1 class="premium-font text-4xl mb-4 gold-text">${data.name || data.original_title}</h1>
                    
                    <div class="mb-6 p-4 rounded-xl border border-gold/20 bg-gold/5">
                        <h3 class="font-bold mb-3 text-sm uppercase tracking-widest opacity-70">Available Now</h3>
                        <div class="flex flex-wrap gap-2">${streamingHTML}</div>
                    </div>

                    <p class="opacity-80 mb-8 leading-relaxed">${data.overview}</p>
                    
                    <h3 class="font-bold mb-4 text-xl">Cast</h3>
                    <div class="flex gap-4 overflow-x-auto pb-4">
                        ${data.credits.cast.slice(0,6).map(c => `
                            <div class="min-w-[80px] text-center">
                                <img src="https://image.tmdb.org/t/p/w200${c.profile_path}" class="w-16 h-16 rounded-full object-cover mx-auto mb-2 border-2 border-gold/50">
                                <p class="text-xs font-bold truncate">${c.name}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            history.pushState({step: 'details'}, "");
        };

        window.closeDetails = () => { document.getElementById('detailOverlay').classList.remove('active'); history.back(); };

        window.handleTyping = (e) => {
            const q = e.target.value; const dd = document.getElementById('searchDropdown');
            if(q.length < 2) { dd.innerHTML = ''; return; }
            fetch(`/api/getShows?query=${q}`).then(r => r.json()).then(data => {
                dd.innerHTML = data.results.slice(0, 5).map(s => `
                    <div class="p-3 border-b dark:border-zinc-800 cursor-pointer hover:bg-gold/10 flex items-center gap-3" onclick="openDetails(${s.id})">
                        <img src="https://image.tmdb.org/t/p/w92${s.poster_path}" class="w-8 h-12 object-cover rounded">
                        <span class="text-sm font-bold">${s.name || s.original_name}</span>
                    </div>`).join('');
            });
        };
        
        // Background Animation
        const canvas = document.getElementById('bgCanvas'), ctx = canvas.getContext('2d');
        function init() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = init; init();
        let particles = Array.from({length: 40}, () => ({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:Math.random()*0.4-0.2, vy:Math.random()*0.4-0.2}));
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(197, 160, 89, 0.4)";
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>canvas.width) p.vx*=-1;
                if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
