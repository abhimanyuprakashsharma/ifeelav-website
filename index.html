<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFEELAV | The Smart Collection (Updated)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #C5A059; --gold-glow: rgba(197, 160, 89, 0.5); }
        body { transition: background 0.5s ease; font-family: 'Inter', sans-serif; background: #ffffff; color: #1a1a1a; overflow-x: hidden; }
        body.dark { background: #050505; color: #ffffff; }
        #bgCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .premium-font { font-family: 'Playfair Display', serif; }
        .gold-text { color: var(--gold); }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(197, 160, 89, 0.2); transition: all 0.3s; }
        body.dark .glass-panel { background: rgba(20, 20, 20, 0.7); border-color: var(--gold); }
        .cat-btn { background: white; border: 1px solid rgba(197, 160, 89, 0.3); transition: 0.4s; }
        body.dark .cat-btn { background: #111; color: white; border-color: var(--gold); }
        .premium-card { cursor: pointer; height: 65vh; width: 100%; max-width: 400px; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        #detailOverlay { position: fixed; inset: 0; z-index: 9999; background: white; transform: translateY(100%); transition: transform 0.4s ease; overflow-y: auto; }
        #detailOverlay.active { transform: translateY(0); }
        body.dark #detailOverlay { background: #050505; }
        #authModal { transition: opacity 0.3s ease; opacity: 0; pointer-events: none; z-index: 300; }
        #authModal.active { opacity: 1; pointer-events: auto; }
        #searchDropdown { position: absolute; top: 110%; left: 0; width: 100%; background: white; border-radius: 12px; z-index: 150; display: none; max-height: 320px; overflow:auto; }
        body.dark #searchDropdown { background: #1a1a1a; border: 1px solid var(--gold); }
        #searchDropdown.active { display: block; }
        /* responsive image handling */
        .poster-img { width:100%; height:100%; object-fit:cover; display:block; }
        .episodes-list { display:flex; flex-direction:column; gap:8px; }
        .episode-item { padding:10px; border-radius:10px; background:rgba(0,0,0,0.04); }
        body.dark .episode-item { background: rgba(255,255,255,0.03); }
        .avatar-choice { width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid transparent;cursor:pointer }
        .avatar-choice.selected { border-color:var(--gold); }
    </style>
</head>
<body class="dark">
    <canvas id="bgCanvas"></canvas>

    <div class="fixed top-0 left-0 w-full z-[150] p-4 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="text-xl md:text-2xl font-bold italic premium-font gold-text cursor-pointer" id="brandTitle">IFEELAV</div>
        <div class="flex gap-2 items-center">
            <button id="darkToggle" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center">🌓</button>
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Search..." autocomplete="off" class="glass-panel rounded-full px-4 py-2 w-32 md:w-64 text-sm outline-none focus:border-[#C5A059]">
                <div id="searchDropdown" class="overflow-hidden"></div>
            </div>
            <button id="authButton" class="glass-panel w-10 h-10 rounded-full overflow-hidden relative border-2 border-gold/30">
                <img id="headerAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" class="w-full h-full object-cover">
            </button>
        </div>
    </div>

    <div id="authModal" class="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-zinc-900 p-6 rounded-3xl w-full max-w-md relative">
            <button id="closeAuth" class="absolute top-4 right-4 text-gray-400">✕</button>
            <div id="loggedOutView">
                <h2 class="premium-font text-2xl mb-4 gold-text">Account</h2>
                <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-3 rounded-xl border dark:bg-zinc-800 dark:border-zinc-700 outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-3 rounded-xl border dark:bg-zinc-800 dark:border-zinc-700 outline-none">
                <div class="flex gap-2 mb-4">
                    <button id="emailSignin" class="flex-1 w-full bg-gold text-white py-3 rounded-xl font-bold">Sign In</button>
                    <button id="emailSignup" class="flex-1 w-full border border-gold text-gold py-3 rounded-xl font-bold">Sign Up</button>
                </div>
                <div class="text-center mb-3">or</div>
                <button id="googleSignin" class="w-full py-3 rounded-xl border border-zinc-300 dark:border-zinc-700">Sign in with Google</button>
                <hr class="my-4">
                <div>
                    <div class="mb-2">Choose Avatar</div>
                    <div id="avatarList" class="flex gap-2"></div>
                    <div class="mt-3">Or upload: <input id="avatarUpload" type="file" accept="image/*"></div>
                </div>
            </div>
            <div id="loggedInView" class="hidden text-center">
                <div id="userAvatarLarge" class="w-20 h-20 bg-gold/10 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl overflow-hidden"></div>
                <h3 id="userDisplay" class="font-bold mb-6 text-xl">User</h3>
                <button id="signOutBtn" class="w-full bg-red-500/10 text-red-500 py-3 rounded-xl font-bold">Sign Out</button>
            </div>
        </div>
    </div>

    <main id="mainContent" class="relative z-10 min-h-screen flex flex-col items-center justify-center pt-20 px-4">
        <section id="step1" class="text-center w-full max-w-3xl">
            <h1 class="premium-font italic text-5xl md:text-7xl gold-text mb-12">IFEELAV</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button data-lang="hi" data-name="Bollywood" class="cat-btn p-6 rounded-2xl font-bold glass-panel region-btn">BOLLYWOOD</button>
                <button data-lang="en" data-name="Hollywood" class="cat-btn p-6 rounded-2xl font-bold glass-panel region-btn">HOLLYWOOD</button>
                <button data-lang="ja" data-name="Anime" class="cat-btn p-6 rounded-2xl font-bold glass-panel region-btn">ANIME</button>
                <button data-lang="ko" data-name="K-Drama" class="cat-btn p-6 rounded-2xl font-bold glass-panel region-btn">K-DRAMA</button>
            </div>
        </section>

        <section id="step2" class="hidden text-center w-full max-w-3xl">
            <h1 id="regionTitle" class="premium-font text-4xl gold-text mb-8"></h1>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <button data-genre="10759" class="glass-panel p-4 rounded-xl font-bold genre-btn">Action</button>
                <button data-genre="35" class="glass-panel p-4 rounded-xl font-bold genre-btn">Comedy</button>
                <button data-genre="18" class="glass-panel p-4 rounded-xl font-bold genre-btn">Drama</button>
                <button data-genre="9648" class="glass-panel p-4 rounded-xl font-bold genre-btn">Mystery</button>
                <button data-genre="10765" class="glass-panel p-4 rounded-xl font-bold genre-btn">Sci-Fi</button>
            </div>
        </section>

        <section id="swipeStep" class="hidden w-full flex flex-col items-center">
            <div id="showCard" class="premium-card relative">
                <!-- use picture + img with srcset for responsive images -->
                <picture id="posterPicture">
                    <img id="poster" class="poster-img" src="" alt="poster">
                </picture>
                <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black to-transparent text-white">
                    <h2 id="cardTitle" class="premium-font text-3xl"></h2>
                </div>
            </div>
            <div class="flex gap-8 mt-8">
                <button id="passBtn" class="w-16 h-16 rounded-full glass-panel flex items-center justify-center">✕</button>
                <button id="likeBtn" class="w-16 h-16 rounded-full bg-gold text-white text-3xl shadow-xl">♥</button>
            </div>
        </section>
    </main>

    <div id="detailOverlay">
        <button id="closeDetail" class="fixed top-6 right-6 z-[210] bg-black/50 text-white w-10 h-10 rounded-full">✕</button>
        <div id="detailContent" class="pb-12"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ----- CONFIG: Replace TMDB_KEY with your TMDB API key -----
        // 🔑 IMPORTANT: YAHAN APNI TMDB API KEY PASTE KARO (WITHOUT KEY WEBSITE DATA LOAD NAHI HOGI)
        const TMDB_KEY = 'PASTE_YOUR_TMDB_API_KEY_HERE';

        const firebaseConfig = {
            apiKey: "AIzaSyAoCZuJ4tGdwmFuz8y-_tc5phvfbn2oi1A",
            authDomain: "ifeelav-app.firebaseapp.com",
            projectId: "ifeelav-app",
            storageBucket: "ifeelav-app.firebasestorage.app",
            messagingSenderId: "1060067685106",
            appId: "1:1060067685106:web:4ba1523ee066af4633966b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // expose some handlers to HTML (so inline elements still work)
        window.toggleDarkMode = () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('ifeelav_dark', document.body.classList.contains('dark'));
        };

        // --- AVATAR: allow choosing or uploading ---
        const avatarSeeds = ['Felix','Ava','Luna','Kai','Riley','Sam','Nova','Ivy'];
        const avatarListEl = document.getElementById('avatarList');
        const headerAvatar = document.getElementById('headerAvatar');
        const userAvatarLarge = document.getElementById('userAvatarLarge');

        function avatarUrlFromSeed(seed){
            return `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(seed)}`;
        }
        function setAvatar(src){
            headerAvatar.src = src; userAvatarLarge.style.backgroundImage = `url('${src}')`; userAvatarLarge.innerHTML='';
            localStorage.setItem('ifeelav_avatar', src);
        }
        (function renderAvatarChoices(){
            avatarSeeds.forEach(seed => {
                const img = document.createElement('img');
                img.src = avatarUrlFromSeed(seed);
                img.className = 'avatar-choice';
                img.title = seed;
                img.addEventListener('click', ()=>{
                    document.querySelectorAll('.avatar-choice').forEach(x=>x.classList.remove('selected'));
                    img.classList.add('selected');
                    setAvatar(img.src);
                });
                avatarListEl.appendChild(img);
            });
            const saved = localStorage.getItem('ifeelav_avatar');
            if(saved){ headerAvatar.src = saved; userAvatarLarge.style.backgroundImage = `url('${saved}')`; }
        })();
        document.getElementById('avatarUpload').addEventListener('change', (e)=>{
            const file = e.target.files[0]; if(!file) return;
            const url = URL.createObjectURL(file); setAvatar(url);
        });

        // ----- AUTH HANDLERS -----
        // attach to window for buttons
        window.handleLogin = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try{ await signInWithEmailAndPassword(auth, e, p); toggleAuthModal(false); }
            catch(err){ alert(err.message); }
        };
        window.handleSignup = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try{ await createUserWithEmailAndPassword(auth, e, p); toggleAuthModal(false); }
            catch(err){ alert(err.message); }
        };
        window.handleLogout = async () => { await signOut(auth); };

        document.getElementById('googleSignin').addEventListener('click', async ()=>{
            try{ await signInWithPopup(auth, provider); toggleAuthModal(false); }
            catch(err){ alert(err.message); }
        });

        onAuthStateChanged(auth, user => {
            const outView = document.getElementById('loggedOutView');
            const inView = document.getElementById('loggedInView');
            if (user) {
                outView.classList.add('hidden'); inView.classList.remove('hidden');
                document.getElementById('userDisplay').innerText = user.email?.split('@')[0] || user.displayName || 'User';
                const saved = localStorage.getItem('ifeelav_avatar');
                if(saved){ userAvatarLarge.style.backgroundImage = `url('${saved}')`; }
            } else {
                outView.classList.remove('hidden'); inView.classList.add('hidden');
            }
        });

        // ------- AUTH MODAL UI -------
        const authModal = document.getElementById('authModal');
        document.getElementById('authButton').addEventListener('click', ()=> toggleAuthModal(true));
        document.getElementById('closeAuth').addEventListener('click', ()=> toggleAuthModal(false));
        function toggleAuthModal(show){ authModal.classList.toggle('active', !!show); }

        // ------- NAV & APP LOGIC -------
        let shows = [], index = 0, selectedLang = '', currentStep = 1;
        document.querySelectorAll('.region-btn').forEach(btn => btn.addEventListener('click', (e)=>{
            const lang = btn.dataset.lang; const name=btn.dataset.name;
            selectedLang = lang; document.getElementById('step1').classList.add('hidden'); document.getElementById('step2').classList.remove('hidden'); document.getElementById('regionTitle').innerText = name; currentStep=2; history.pushState({step:2}, '');
        }));

        document.querySelectorAll('.genre-btn').forEach(btn => btn.addEventListener('click', ()=>{
            const gid = btn.dataset.genre; document.getElementById('step2').classList.add('hidden'); document.getElementById('swipeStep').classList.remove('hidden'); currentStep=3; history.pushState({step:3}, ''); fetchShowsByGenre(gid);
        }));

        window.addEventListener('popstate', (event)=>{
            if(!event.state || event.state.step===1){ location.reload(); }
            else if(event.state.step===2){ document.getElementById('swipeStep').classList.add('hidden'); document.getElementById('step2').classList.remove('hidden'); currentStep=2; }
            else if(event.state.step==='details'){ // go back from details
                document.getElementById('detailOverlay').classList.remove('active');
            }
        });

        // ----- SEARCH (uses TMDB search/tv) -----
        const searchInput = document.getElementById('searchInput');
        const searchDropdown = document.getElementById('searchDropdown');
        let searchTimer;
        searchInput.addEventListener('input', (e)=>{
            clearTimeout(searchTimer);
            const q = e.target.value.trim(); if(q.length<2){ searchDropdown.classList.remove('active'); return; }
            searchTimer = setTimeout(()=> searchQuery(q), 300);
        });
        async function searchQuery(q){
            if(!TMDB_KEY || TMDB_KEY==='REPLACE_WITH_TMDB_API_KEY'){ searchDropdown.innerHTML = '<div class="p-3">Please set TMDB API key in code.</div>'; searchDropdown.classList.add('active'); return; }
            const res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&language=${selectedLang||'en-US'}`);
            const data = await res.json();
            if(!data.results) { searchDropdown.innerHTML = '<div class="p-3">No results</div>'; searchDropdown.classList.add('active'); return; }
            searchDropdown.innerHTML = data.results.slice(0,8).map(s=>`<div class="p-3 border-b dark:border-zinc-800 cursor-pointer hover:bg-gold/10" data-id="${s.id}">${s.name || s.original_name}</div>`).join('');
            searchDropdown.classList.add('active');
            // attach listeners
            Array.from(searchDropdown.querySelectorAll('[data-id]')).forEach(el => el.addEventListener('click', ()=>{
                const id = el.dataset.id; openDetails(id);
                searchDropdown.classList.remove('active');
            }));
        }

        // ----- FETCH SHOWS (discover by genre) -----
        async function fetchShowsByGenre(gid){
            if(!TMDB_KEY || TMDB_KEY==='REPLACE_WITH_TMDB_API_KEY'){ alert('Please set TMDB API Key in the code to load shows.'); return; }
            const url = `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_genres=${gid}&language=${selectedLang||'en-US'}&sort_by=popularity.desc`;
            const res = await fetch(url); const data = await res.json();
            shows = (data.results || []).filter(s => s.poster_path);
            index = 0; renderCard();
        }

        function getPosterSrcset(path){
            return `${path?`https://image.tmdb.org/t/p/w300${path} 300w,https://image.tmdb.org/t/p/w780${path} 780w,https://image.tmdb.org/t/p/original${path} 1280w` : ''}`;
        }

        function renderCard(){
            const p = document.getElementById('poster'); const cardTitle = document.getElementById('cardTitle');
            if(!shows[index]){ cardTitle.innerText = 'No more shows'; p.src=''; return; }
            const s = shows[index];
            // responsive srcset
            p.src = `https://image.tmdb.org/t/p/w780${s.poster_path}`;
            p.srcset = getPosterSrcset(s.poster_path);
            p.sizes = '(max-width: 640px) 90vw, 400px';
            cardTitle.innerText = s.name || s.original_name || 'Untitled';
            // attach click
            document.getElementById('showCard').onclick = ()=> openDetails(s.id);
        }

        document.getElementById('passBtn').addEventListener('click', ()=> handleAction('pass'));
        document.getElementById('likeBtn').addEventListener('click', ()=> handleAction('smash'));

        window.handleAction = (type)=>{
            const card = document.getElementById('showCard');
            card.style.transform = type === 'smash' ? 'translateX(100%) rotate(20deg)' : 'translateX(-100%) rotate(-20deg)';
            card.style.opacity = '0';
            setTimeout(()=>{ index++; card.style.transform=''; card.style.opacity='1'; renderCard(); }, 300);
        };

        // ----- OPEN DETAILS: show rating + season/episode list -----
        async function openDetails(id){
            if(!TMDB_KEY || TMDB_KEY==='REPLACE_WITH_TMDB_API_KEY'){ alert('Please set TMDB API Key in the code to view details.'); return; }
            document.getElementById('detailOverlay').classList.add('active');
            history.pushState({step:'details'}, '');
            const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${TMDB_KEY}&language=${selectedLang||'en-US'}`);
            const data = await res.json();
            const backdrop = data.backdrop_path ? `https://image.tmdb.org/t/p/original${data.backdrop_path}` : '';
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            // build html
            let html = `<div class="h-[40vh] relative"><img src="${backdrop}" class="w-full h-full object-cover"></div>
                <div class="p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h1 class="premium-font text-3xl mb-0 gold-text">${data.name}</h1>
                        <div class="text-sm">Rating: <strong>${rating}</strong> (${data.vote_count || 0} votes)</div>
                    </div>
                    <p class="opacity-80 mb-4">${data.overview || ''}</p>
                    <h3 class="font-bold mb-2">Seasons & Episodes</h3>
                    <div id="seasonsContainer" class="flex flex-col gap-3"></div>
                </div>`;
            document.getElementById('detailContent').innerHTML = html;

            // load seasons list
            const seasonsContainer = document.getElementById('seasonsContainer');
            if(Array.isArray(data.seasons)){
                for(const season of data.seasons){
                    // only show seasons with episodes info (season_number>0) - skip specials if you want
                    const btn = document.createElement('div');
                    btn.className = 'glass-panel p-3 rounded-xl flex items-center justify-between';
                    btn.innerHTML = `<div><strong>${season.name || ('Season '+season.season_number)}</strong> <div class="text-sm opacity-80">Episodes: ${season.episode_count || '—'}</div></div><div><button class='open-season-button' data-tv='${data.id}' data-season='${season.season_number}'>View Episodes</button></div>`;
                    seasonsContainer.appendChild(btn);
                }
                // attach listeners for view episodes
                Array.from(document.getElementsByClassName('open-season-button')).forEach(b=> b.addEventListener('click', async (e)=>{
                    const tv = b.dataset.tv; const sNum = b.dataset.season;
                    await loadSeasonEpisodes(tv, sNum, b.parentElement);
                }));
            }
        }

        async function loadSeasonEpisodes(tvId, seasonNumber, attachToEl){
            // fetch season details
            attachToEl.innerHTML = '<div class="p-3">Loading episodes...</div>';
            const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNumber}?api_key=${TMDB_KEY}&language=${selectedLang||'en-US'}`);
            const data = await res.json();
            if(!data.episodes){ attachToEl.innerHTML = '<div class="p-3">No episodes found.</div>'; return; }
            const list = document.createElement('div'); list.className = 'episodes-list mt-3';
            data.episodes.forEach(ep => {
                const el = document.createElement('div'); el.className='episode-item';
                el.innerHTML = `<div class="flex items-center justify-between"><div><strong>S${seasonNumber}E${ep.episode_number} — ${ep.name}</strong><div class="text-sm opacity-70">Air Date: ${ep.air_date || '—'}</div></div><div class="text-sm">Rating: <strong>${ep.vote_average?ep.vote_average.toFixed(1):'N/A'}</strong></div></div><div class="mt-2 text-sm opacity-80">${ep.overview || ''}</div>`;
                list.appendChild(el);
            });
            attachToEl.innerHTML = ''; attachToEl.appendChild(list);
        }

        document.getElementById('closeDetail').addEventListener('click', ()=>{ document.getElementById('detailOverlay').classList.remove('active'); history.back(); });

        // restore dark mode preference
        if(localStorage.getItem('ifeelav_dark')==='true') document.body.classList.add('dark');

        // clicking brand reloads to home
        document.getElementById('brandTitle').addEventListener('click', ()=>{ location.reload(); });

    </script>
</body>
</html>
