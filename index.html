<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFEELAV | Pro Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #C5A059; --bg-light: #ffffff; --text-light: #1a1a1a; --bg-dark: #0f0f0f; --text-dark: #f5f5f5; }
        body { transition: background 0.4s, color 0.4s; font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-light); }
        body.dark { background: var(--bg-dark); color: var(--text-dark); }
        
        /* Dark Mode Specific Styles */
        body.dark .glass-panel { background: rgba(30, 30, 30, 0.8); border-color: rgba(197, 160, 89, 0.2); color: white; }
        body.dark .premium-card { background: #1a1a1a; border-color: #333; }
        body.dark #detailOverlay { background: #0f0f0f; color: white; }
        
        .premium-font { font-family: 'Playfair Display', serif; }
        .gold-text { color: var(--gold); }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(197, 160, 89, 0.2); }
        .premium-card { transition: transform 0.3s; height: 65vh; max-width: 400px; border-radius: 30px; overflow: hidden; }
        
        #detailOverlay { transition: 0.4s; opacity: 0; pointer-events: none; transform: translateY(50px); background: white; }
        #detailOverlay.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
        
        .ep-card { background: rgba(197, 160, 89, 0.05); border-left: 4px solid var(--gold); }
        .avatar-option { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .avatar-option.selected { border-color: var(--gold); transform: scale(1.1); }
    </style>
</head>
<body class="dark"> <canvas id="bgCanvas" class="fixed inset-0 z-[-1]"></canvas>

    <div class="fixed top-0 left-0 w-full z-50 p-4 flex justify-between items-center bg-transparent backdrop-blur-md">
        <div class="text-xl font-bold italic premium-font gold-text" onclick="location.reload()">IFEELAV</div>
        <div class="flex gap-2 items-center">
            <button onclick="toggleDarkMode()" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center">🌓</button>
            
            <div class="relative">
                <input type="text" id="searchInput" oninput="handleTyping(event)" placeholder="Search..." class="glass-panel rounded-full px-4 py-2 w-32 md:w-64 text-sm outline-none">
                <div id="searchDropdown" class="absolute top-full left-0 w-full mt-2 hidden glass-panel rounded-2xl overflow-hidden shadow-2xl"></div>
            </div>

            <button onclick="toggleAuthModal()" class="glass-panel w-10 h-10 rounded-full overflow-hidden">
                <img id="headerAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" class="w-full h-full object-cover">
            </button>
        </div>
    </div>

    <div id="appBody" class="relative z-10 min-h-screen flex flex-col items-center justify-center p-6">
        <div id="step1" class="text-center fade-in">
            <h1 class="premium-font italic text-6xl gold-text mb-8">IFEELAV</h1>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="selectRegion('hi', 'Bollywood')" class="glass-panel p-6 rounded-2xl font-bold hover:scale-105 transition">BOLLYWOOD</button>
                <button onclick="selectRegion('en', 'Hollywood')" class="glass-panel p-6 rounded-2xl font-bold hover:scale-105 transition">HOLLYWOOD</button>
                <button onclick="selectRegion('ja', 'Anime')" class="glass-panel p-6 rounded-2xl font-bold hover:scale-105 transition">ANIME</button>
                <button onclick="selectRegion('ko', 'K-Drama')" class="glass-panel p-6 rounded-2xl font-bold hover:scale-105 transition">K-Drama</button>
            </div>
        </div>

        <div id="step2" class="hidden text-center fade-in">
            <h1 id="regionTitle" class="premium-font text-4xl gold-text mb-8"></h1>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <button onclick="startApp('28')" class="glass-panel p-4 rounded-xl font-bold">Action</button>
                <button onclick="startApp('35')" class="glass-panel p-4 rounded-xl font-bold">Comedy</button>
                <button onclick="startApp('9648')" class="glass-panel p-4 rounded-xl font-bold">Mystery</button>
                <button onclick="startApp('10765')" class="glass-panel p-4 rounded-xl font-bold">Sci-Fi</button>
            </div>
        </div>

        <div id="swipeStep" class="hidden w-full flex flex-col items-center">
            <div id="showCard" onclick="openDetails(shows[index].id)" class="premium-card relative shadow-2xl border border-white/10">
                <img id="poster" src="" class="w-full h-full object-cover">
                <div class="absolute bottom-0 p-6 bg-gradient-to-t from-black to-transparent w-full text-white">
                    <h2 id="title" class="premium-font text-3xl"></h2>
                </div>
            </div>
            <div class="flex gap-6 mt-6">
                <button onclick="handleAction('pass')" class="w-16 h-16 rounded-full glass-panel text-2xl">✕</button>
                <button onclick="handleAction('smash')" class="w-16 h-16 rounded-full bg-[#C5A059] text-white text-2xl">♥</button>
            </div>
        </div>
    </div>

    <div id="detailOverlay" class="fixed inset-0 z-[60] overflow-y-auto hidden">
        <button onclick="closeDetails()" class="fixed top-6 right-6 z-[70] text-3xl">✕</button>
        <div class="relative h-[50vh]">
            <img id="detailBackdrop" src="" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-current to-transparent"></div>
        </div>
        
        <div class="max-w-4xl mx-auto p-6 -mt-20 relative z-10">
            <h1 id="detailTitle" class="premium-font text-5xl mb-4"></h1>
            <p id="detailOverview" class="text-lg opacity-80 mb-8"></p>
            
            <div id="episodeSection" class="mb-12">
                <h3 class="gold-text premium-font text-2xl mb-6 flex items-center gap-2">
                    📺 Episode Ratings (Season 1)
                </h3>
                <div id="episodeList" class="grid gap-4">
                    </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase Config and Auth Logic same as before...
        // [Add your firebaseConfig here as provided in previous turns]

        window.toggleDarkMode = () => { document.body.classList.toggle('dark'); }

        window.openDetails = async (id) => {
            const overlay = document.getElementById('detailOverlay');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('active'), 10);

            // Fetch Details
            const res = await fetch(`/api/getDetails?id=${id}`);
            const data = await res.json();
            
            document.getElementById('detailTitle').innerText = data.name;
            document.getElementById('detailOverview').innerText = data.overview;
            document.getElementById('detailBackdrop').src = `https://image.tmdb.org/t/p/original${data.backdrop_path || data.poster_path}`;

            // FETCH EPISODES
            fetchEpisodes(id, 1);
        }

        async function fetchEpisodes(id, seasonNum) {
            const list = document.getElementById('episodeList');
            list.innerHTML = '<p class="opacity-50 italic">Fetching episode ratings...</p>';
            
            try {
                const res = await fetch(`/api/getEpisodes?id=${id}&season=${seasonNum}`);
                const data = await res.json();
                
                list.innerHTML = data.episodes.map(ep => `
                    <div class="ep-card p-4 rounded-xl flex justify-between items-center glass-panel">
                        <div class="flex gap-4 items-center">
                            <span class="text-2xl font-bold opacity-20">E${ep.episode_number}</span>
                            <div>
                                <h4 class="font-bold">${ep.name}</h4>
                                <p class="text-xs opacity-60 truncate w-48">${ep.overview || 'No synopsis available.'}</p>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="bg-gold-text px-3 py-1 rounded-full text-xs font-bold ${ep.vote_average > 8 ? 'bg-green-500/20 text-green-500' : 'bg-gold/20 text-gold'}">
                                ★ ${ep.vote_average.toFixed(1)}
                            </span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = '<p class="text-red-500">Could not load episode ratings.</p>';
            }
        }

        window.closeDetails = () => {
            const overlay = document.getElementById('detailOverlay');
            overlay.classList.remove('active');
            setTimeout(() => overlay.classList.add('hidden'), 400);
        }

        // Rest of the Swipe/Search logic remains same...
    </script>
</body>
</html>
