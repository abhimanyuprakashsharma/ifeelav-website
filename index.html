<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFEELAV | The Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #C5A059; }
        
        /* DEFAULT LIGHT MODE STYLES */
        body { 
            transition: background 0.3s ease, color 0.3s ease; 
            font-family: 'Inter', sans-serif; 
            background: #ffffff; 
            color: #1a1a1a; 
            overflow-x: hidden; 
        }

        /* DARK MODE OVERRIDES */
        body.dark { 
            background: #0a0a0a; 
            color: #f5f5f5; 
        }

        /* GLASS PANELS */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(0,0,0,0.1); 
            transition: 0.3s; 
        }
        body.dark .glass-panel { 
            background: rgba(30, 30, 30, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
        }

        /* BUTTONS */
        .cat-btn { background: #f9f9f9; border: 1px solid #eee; transition: 0.3s; }
        .cat-btn:hover { background: var(--gold); color: white; transform: translateY(-3px); }
        body.dark .cat-btn { background: #1a1a1a; border-color: #333; color: #ddd; }
        body.dark .cat-btn:hover { background: var(--gold); color: white; }

        /* CARD */
        .premium-card { 
            height: 65vh; width: 100%; max-width: 400px; 
            border-radius: 30px; overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            position: relative; cursor: pointer;
            transition: transform 0.3s ease;
        }

        /* OVERLAYS & MODALS (Fixed Z-Index) */
        #detailOverlay { 
            position: fixed; inset: 0; z-index: 50; 
            background: white; 
            transform: translateY(100%); 
            transition: transform 0.3s ease; 
            overflow-y: auto; 
        }
        body.dark #detailOverlay { background: #000; }
        #detailOverlay.active { transform: translateY(0); }

        #authModal { 
            position: fixed; inset: 0; z-index: 100; /* Highest Priority */
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #authModal.active { opacity: 1; pointer-events: auto; }

        #searchDropdown { 
            position: absolute; top: 110%; left: 0; width: 100%; 
            background: white; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            z-index: 40; display: none; overflow: hidden;
        }
        body.dark #searchDropdown { background: #1a1a1a; border: 1px solid #333; }
        #searchDropdown.active { display: block; }
        
        .gold-text { color: var(--gold); }
        .premium-font { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body> <div class="fixed top-0 left-0 w-full z-40 p-4 flex justify-between items-center bg-white/80 dark:bg-black/80 backdrop-blur-md">
        <div class="text-xl font-bold italic premium-font gold-text cursor-pointer" onclick="location.reload()">IFEELAV</div>
        <div class="flex gap-2 items-center">
            
            <button onclick="window.toggleDarkMode()" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center">🌓</button>
            
            <div class="relative">
                <input type="text" id="searchInput" oninput="window.handleTyping(event)" placeholder="Search..." class="glass-panel rounded-full px-4 py-2 w-32 md:w-64 text-sm outline-none">
                <div id="searchDropdown"></div>
            </div>

            <button onclick="window.toggleAuthModal()" class="glass-panel w-10 h-10 rounded-full overflow-hidden relative border-2 border-transparent hover:border-[#C5A059]">
                <img id="headerAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Guest" class="w-full h-full object-cover">
            </button>
        </div>
    </div>

    <div id="mainContent" class="relative z-10 min-h-screen flex flex-col items-center justify-center pt-20 px-4">
        
        <div id="step1" class="text-center w-full max-w-3xl">
            <h1 class="premium-font italic text-5xl md:text-7xl gold-text mb-12">IFEELAV</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="window.selectRegion('hi', 'Bollywood')" class="cat-btn p-6 rounded-2xl font-bold">BOLLYWOOD</button>
                <button onclick="window.selectRegion('en', 'Hollywood')" class="cat-btn p-6 rounded-2xl font-bold">HOLLYWOOD</button>
                <button onclick="window.selectRegion('ja', 'Anime')" class="cat-btn p-6 rounded-2xl font-bold">ANIME</button>
                <button onclick="window.selectRegion('ko', 'K-Drama')" class="cat-btn p-6 rounded-2xl font-bold">K-DRAMA</button>
            </div>
        </div>

        <div id="step2" class="hidden text-center w-full max-w-3xl">
            <h1 id="regionTitle" class="premium-font text-4xl gold-text mb-8"></h1>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <button onclick="window.startApp('28')" class="glass-panel p-4 rounded-xl font-bold">Action</button>
                <button onclick="window.startApp('35')" class="glass-panel p-4 rounded-xl font-bold">Comedy</button>
                <button onclick="window.startApp('18')" class="glass-panel p-4 rounded-xl font-bold">Drama</button>
                <button onclick="window.startApp('9648')" class="glass-panel p-4 rounded-xl font-bold">Mystery</button>
                <button onclick="window.startApp('10765')" class="glass-panel p-4 rounded-xl font-bold">Sci-Fi</button>
            </div>
            <button onclick="window.resetToStep1()" class="text-gray-400 text-sm uppercase">← Back</button>
        </div>

        <div id="swipeStep" class="hidden w-full flex flex-col items-center">
            <div id="showCard" onclick="window.openCurrentCard()" class="premium-card relative">
                <img id="poster" src="" class="w-full h-full object-cover">
                <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black to-transparent text-white">
                    <h2 id="cardTitle" class="premium-font text-3xl"></h2>
                </div>
            </div>
            <div class="flex gap-8 mt-8">
                <button onclick="window.handleAction('pass')" class="w-16 h-16 rounded-full glass-panel flex items-center justify-center text-2xl">✕</button>
                <button onclick="window.handleAction('smash')" class="w-16 h-16 rounded-full bg-[#C5A059] text-white text-3xl shadow-xl">♥</button>
            </div>
        </div>
    </div>

    <div id="detailOverlay">
        <button onclick="window.closeDetails()" class="fixed top-6 right-6 z-[60] bg-black/50 text-white w-10 h-10 rounded-full flex items-center justify-center">✕</button>
        <div id="detailContent"></div>
    </div>

    <div id="authModal">
        <div class="bg-white dark:bg-zinc-900 p-8 rounded-3xl w-full max-w-sm relative shadow-2xl">
            <button onclick="window.toggleAuthModal()" class="absolute top-4 right-4 text-gray-400">✕</button>
            
            <div id="authForms">
                <h2 class="premium-font text-2xl mb-4 gold-text">Login / Signup</h2>
                <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-3 rounded-xl border dark:bg-zinc-800 dark:border-zinc-700">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 rounded-xl border dark:bg-zinc-800 dark:border-zinc-700">
                <div class="flex gap-2">
                    <button onclick="window.handleLogin()" class="flex-1 bg-[#C5A059] text-white py-3 rounded-xl font-bold">Login</button>
                    <button onclick="window.handleSignup()" class="flex-1 border border-[#C5A059] text-[#C5A059] py-3 rounded-xl font-bold">Sign Up</button>
                </div>
            </div>

            <div id="userProfile" class="hidden text-center">
                <div class="w-20 h-20 mx-auto mb-4 rounded-full overflow-hidden border-4 border-[#C5A059]">
                    <img id="profileAvatar" src="" class="w-full h-full object-cover">
                </div>
                <h3 id="userEmailDisplay" class="font-bold mb-6">User</h3>
                <button onclick="window.handleLogout()" class="w-full bg-red-100 text-red-500 py-3 rounded-xl font-bold">Sign Out</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAoCZuJ4tGdwmFuz8y-_tc5phvfbn2oi1A",
            authDomain: "ifeelav-app.firebaseapp.com",
            projectId: "ifeelav-app",
            storageBucket: "ifeelav-app.firebasestorage.app",
            messagingSenderId: "1060067685106",
            appId: "1:1060067685106:web:4ba1523ee066af4633966b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- GLOBAL VARIABLES ---
        let shows = [];
        let index = 0;
        let selectedLang = '';
        let searchTimer;

        // --- ATTACH FUNCTIONS TO WINDOW (Crucial for HTML buttons to work) ---
        
        window.toggleDarkMode = () => document.body.classList.toggle('dark');
        window.toggleAuthModal = () => document.getElementById('authModal').classList.toggle('active');

        // AUTH FUNCTIONS
        window.handleLogin = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try { await signInWithEmailAndPassword(auth, e, p); window.toggleAuthModal(); } catch(err) { alert(err.message); }
        };

        window.handleSignup = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try { await createUserWithEmailAndPassword(auth, e, p); window.toggleAuthModal(); } catch(err) { alert(err.message); }
        };

        window.handleLogout = async () => { await signOut(auth); window.toggleAuthModal(); };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authForms').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
                const av = `https://api.dicebear.com/7.x/adventurer/svg?seed=${user.uid}`;
                document.getElementById('headerAvatar').src = av;
                document.getElementById('profileAvatar').src = av;
            } else {
                document.getElementById('authForms').classList.remove('hidden');
                document.getElementById('userProfile').classList.add('hidden');
                document.getElementById('headerAvatar').src = "https://api.dicebear.com/7.x/adventurer/svg?seed=Guest";
            }
        });

        // NAVIGATION
        window.selectRegion = (lang, name) => {
            selectedLang = lang;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('regionTitle').innerText = name;
            history.pushState({step: 2}, "");
        };

        window.resetToStep1 = () => {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        };

        window.startApp = (gid) => {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('swipeStep').classList.remove('hidden');
            fetchShows(`/api/getShows?genre=${gid}&lang=${selectedLang}`);
            history.pushState({step: 3}, "");
        };

        // BACK BUTTON HANDLER
        window.addEventListener('popstate', (e) => {
            if(!e.state) location.reload();
            if(e.state.step === 2) {
                document.getElementById('swipeStep').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            }
        });

        // SHOW LOGIC
        async function fetchShows(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                shows = data.results.filter(s => s.poster_path);
                index = 0;
                renderCard();
            } catch(e) { console.error(e); }
        }

        function renderCard() {
            if(index >= shows.length) { alert("No more shows!"); return; }
            document.getElementById('cardTitle').innerText = shows[index].name || shows[index].original_name;
            document.getElementById('poster').src = `https://image.tmdb.org/t/p/w780${shows[index].poster_path}`;
        }

        window.handleAction = (type) => {
            const card = document.getElementById('showCard');
            card.style.transform = type === 'smash' ? 'translateX(100%)' : 'translateX(-100%)';
            card.style.opacity = '0';
            setTimeout(() => {
                index++; card.style.transform = ''; card.style.opacity = '1'; renderCard();
            }, 300);
        };

        window.openCurrentCard = () => {
            if(shows[index]) window.openDetails(shows[index].id);
        }

        // DETAILS & STREAMING (Safe Mode)
        window.openDetails = async (id) => {
            document.getElementById('searchDropdown').classList.remove('active');
            document.getElementById('detailOverlay').classList.add('active');
            
            // 1. Show Basic Info Immediately
            const res = await fetch(`/api/getDetails?id=${id}`);
            const data = await res.json();
            
            let html = `
                <div class="h-[50vh] relative"><img src="https://image.tmdb.org/t/p/original${data.backdrop_path || data.poster_path}" class="w-full h-full object-cover"></div>
                <div class="p-6">
                    <h1 class="premium-font text-4xl mb-2 gold-text">${data.name}</h1>
                    <div id="streamBox" class="mb-4"></div>
                    <p class="opacity-80 leading-relaxed">${data.overview}</p>
                </div>
            `;
            document.getElementById('detailContent').innerHTML = html;
            history.pushState({step: 'details'}, "");

            // 2. Try Fetching Stream (Don't break if fails)
            try {
                const streamRes = await fetch(`/api/getStream?tmdb_id=${id}&type=tv`);
                const streamData = await streamRes.json();
                if(streamData.sources && streamData.sources.length > 0) {
                    const links = streamData.sources.map(s => `<a href="${s.url}" target="_blank" class="block bg-black/10 dark:bg-white/10 p-3 rounded mb-2 border-l-4 border-[#C5A059]">▶ Watch on ${s.name}</a>`).join('');
                    document.getElementById('streamBox').innerHTML = `<h3 class="font-bold text-sm mb-2 opacity-50 uppercase">Streaming Now</h3>${links}`;
                }
            } catch(e) { console.log("Streaming info failed", e); }
        };

        window.closeDetails = () => {
            document.getElementById('detailOverlay').classList.remove('active');
            history.back();
        };

        // SEARCH
        window.handleTyping = (e) => {
            const q = e.target.value;
            const dd = document.getElementById('searchDropdown');
            if(q.length < 2) { dd.classList.remove('active'); return; }
            
            clearTimeout(searchTimer);
            searchTimer = setTimeout(async () => {
                const res = await fetch(`/api/getShows?query=${q}`);
                const data = await res.json();
                dd.innerHTML = data.results.slice(0, 5).map(s => `
                    <div class="p-3 border-b dark:border-zinc-800 cursor-pointer flex gap-3 items-center hover:bg-black/5" onclick="window.openDetails(${s.id})">
                        <img src="https://image.tmdb.org/t/p/w92${s.poster_path}" class="w-8 h-12 object-cover rounded">
                        <span class="font-bold text-sm">${s.name || s.original_name}</span>
                    </div>
                `).join('');
                dd.classList.add('active');
            }, 300);
        };

    </script>
</body>
</html>
