<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFEELAV | Curated by Abhimanyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #C5A059; }
        .no-select { user-select: none; -webkit-user-select: none; }
        
        /* THEME TRANSITIONS */
        body { transition: background 0.3s ease, color 0.3s ease; font-family: 'Inter', sans-serif; background: #fdfdfd; color: #1a1a1a; overflow-x: hidden; }
        body.dark { background: #050505; color: #f0f0f0; }

        .brand-font { font-family: 'Cinzel', serif; }
        .gold-text { color: var(--gold); }

        /* CINEMATIC BACKGROUND ANIMATION */
        #posterBg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; opacity: 0.08; overflow: hidden; pointer-events: none; }
        .poster-grid { display: flex; flex-wrap: wrap; gap: 10px; width: 150%; animation: glide 60s linear infinite; transform: rotate(-5deg) translateY(-20%); }
        @keyframes glide { 0% { transform: rotate(-5deg) translateY(0); } 100% { transform: rotate(-5deg) translateY(-50%); } }
        body.dark #posterBg { opacity: 0.15; filter: grayscale(80%); }

        /* GLASS PANELS & CARDS */
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.1); transition: 0.3s; }
        body.dark .glass-panel { background: rgba(20, 20, 20, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); color: white; }

        .premium-card { 
            height: 65vh; width: 100%; max-width: 400px; border-radius: 30px; overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; cursor: grab;
            touch-action: none; transform-origin: center bottom;
        }

        /* DIALOGUE ANIMATION */
        .dialogue-box { animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }

        /* SEARCH DROPDOWN & HISTORY */
        #searchDropdown { position: absolute; top: 120%; left: 0; width: 100%; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 50; display: none; max-height: 300px; overflow-y: auto; }
        body.dark #searchDropdown { background: #1a1a1a; border: 1px solid #333; }
        #searchDropdown.active { display: block; }

        /* MODALS */
        #detailOverlay { position: fixed; inset: 0; z-index: 60; background: white; transform: translateY(100%); transition: transform 0.3s ease; overflow-y: auto; }
        body.dark #detailOverlay { background: #080808; }
        #detailOverlay.active { transform: translateY(0); }

        #authModal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
        #authModal.active { display: flex; }
    </style>
</head>
<body class="light"> <div id="posterBg"></div>

    <div class="fixed top-0 left-0 w-full z-40 p-4 flex justify-between items-center bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
        <div class="text-xl font-bold brand-font gold-text no-select cursor-pointer" onclick="location.reload()">IFEELAV</div>
        <div class="flex gap-2 items-center">
            <button onclick="window.toggleDarkMode()" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center">🌓</button>
            <div class="relative">
                <input type="text" id="searchInput" onfocus="window.showHistory()" oninput="window.handleTyping(event)" placeholder="Search..." class="glass-panel rounded-full px-4 py-2 w-28 md:w-64 text-sm outline-none">
                <div id="searchDropdown"></div>
            </div>
            <button onclick="window.toggleAuthModal()" class="glass-panel w-10 h-10 rounded-full overflow-hidden relative border border-transparent hover:border-[#C5A059]">
                <img id="headerAvatar" src="https://api.dicebear.com/7.x/notionists/svg?seed=Guest" class="w-full h-full object-cover">
            </button>
        </div>
    </div>

    <div id="mainContent" class="relative z-10 min-h-screen flex flex-col items-center justify-center pt-20 px-4 pb-20">
        
        <div id="step1" class="text-center w-full max-w-4xl fade-in">
            <h1 class="brand-font text-5xl md:text-8xl gold-text mb-4 no-select tracking-tighter drop-shadow-sm">IFEELAV</h1>
            <p class="text-xs md:text-sm text-gray-500 dark:text-gray-400 mb-10 uppercase tracking-[0.3em] no-select">Curated by Abhimanyu</p>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="window.selectRegion('hi', 'Bollywood')" class="glass-panel p-6 rounded-2xl font-bold hover:bg-gold hover:text-white transition transform hover:-translate-y-1">BOLLYWOOD</button>
                <button onclick="window.selectRegion('en', 'Hollywood')" class="glass-panel p-6 rounded-2xl font-bold hover:bg-gold hover:text-white transition transform hover:-translate-y-1">HOLLYWOOD</button>
                <button onclick="window.selectRegion('ja', 'Anime')" class="glass-panel p-6 rounded-2xl font-bold hover:bg-gold hover:text-white transition transform hover:-translate-y-1">ANIME</button>
                <button onclick="window.selectRegion('ko', 'K-Drama')" class="glass-panel p-6 rounded-2xl font-bold hover:bg-gold hover:text-white transition transform hover:-translate-y-1">K-DRAMA</button>
            </div>
        </div>

        <div id="step2" class="hidden text-center w-full max-w-3xl fade-in">
            <h1 id="regionTitle" class="brand-font text-3xl gold-text mb-2 no-select"></h1>
            <p class="text-xs uppercase tracking-widest opacity-50 mb-8">Select your mood</p>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <button onclick="window.startApp('28')" class="glass-panel p-4 rounded-xl font-bold hover:border-gold">Action</button>
                <button onclick="window.startApp('35')" class="glass-panel p-4 rounded-xl font-bold hover:border-gold">Comedy</button>
                <button onclick="window.startApp('18')" class="glass-panel p-4 rounded-xl font-bold hover:border-gold">Drama</button>
                <button onclick="window.startApp('9648')" class="glass-panel p-4 rounded-xl font-bold hover:border-gold">Mystery</button>
                <button onclick="window.startApp('10765')" class="glass-panel p-4 rounded-xl font-bold hover:border-gold">Sci-Fi</button>
            </div>
            <button onclick="history.back()" class="text-gray-400 text-xs uppercase tracking-widest p-4">← Go Back</button>
        </div>

        <div id="swipeStep" class="hidden w-full flex flex-col items-center">
            
            <div id="dialogueBox" class="mb-6 text-center h-12 flex items-center justify-center px-4">
                <p class="italic text-sm md:text-lg font-serif text-gray-600 dark:text-gray-300">"Loading cool vibes..."</p>
            </div>

            <div id="showCard" class="premium-card relative bg-gray-200 dark:bg-zinc-800">
                <img id="poster" src="" class="w-full h-full object-cover select-none pointer-events-none">
                <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black via-black/60 to-transparent text-white">
                    <h2 id="cardTitle" class="brand-font text-3xl leading-none mb-2 no-select"></h2>
                    <p id="cardMeta" class="text-xs opacity-70 font-sans"></p>
                    <p class="text-[10px] mt-2 uppercase tracking-widest text-gold opacity-80">Tap for details</p>
                </div>
                
                <div id="nope" class="absolute top-10 right-10 border-4 border-red-500 text-red-500 font-bold px-4 py-2 rounded transform rotate-12 opacity-0 text-2xl">NOPE</div>
                <div id="like" class="absolute top-10 left-10 border-4 border-green-500 text-green-500 font-bold px-4 py-2 rounded transform -rotate-12 opacity-0 text-2xl">YEAH</div>
            </div>

            <div class="flex gap-8 mt-8">
                <button onclick="window.handleAction('pass')" class="w-16 h-16 rounded-full glass-panel flex items-center justify-center text-2xl hover:bg-red-500/10 transition text-red-500">✕</button>
                <button onclick="window.handleAction('smash')" class="w-16 h-16 rounded-full bg-[#C5A059] text-white text-3xl shadow-xl hover:scale-110 transition">♥</button>
            </div>
        </div>
    </div>

    <div class="w-full text-center py-8 opacity-60 text-xs no-select fixed bottom-0 left-0 pointer-events-none md:pointer-events-auto">
        <a href="https://instagram.com/axviixv" target="_blank" class="pointer-events-auto flex items-center justify-center gap-2 hover:text-[#C5A059] transition">
            <i class="fab fa-instagram text-xl"></i>
            <span class="font-bold">Abhimanyu</span>
        </a>
    </div>

    <div id="detailOverlay">
        <button onclick="window.closeDetails()" class="fixed top-6 right-6 z-[60] bg-black/60 text-white w-10 h-10 rounded-full flex items-center justify-center">✕</button>
        <div id="detailContent"></div>
    </div>

    <div id="authModal">
        <div class="bg-white dark:bg-[#111] p-8 rounded-3xl w-full max-w-sm relative shadow-2xl border border-gray-100 dark:border-gray-800">
            <button onclick="window.toggleAuthModal()" class="absolute top-4 right-4 text-gray-400">✕</button>
            
            <div id="authForms">
                <h2 class="brand-font text-2xl mb-4 gold-text text-center">Identity</h2>
                <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-3 rounded-xl border dark:bg-[#222] dark:border-[#333] outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 rounded-xl border dark:bg-[#222] dark:border-[#333] outline-none">
                <button onclick="window.handleLogin()" class="w-full bg-[#C5A059] text-white py-3 rounded-xl font-bold mb-3">Login</button>
                <button onclick="window.handleSignup()" class="w-full border border-[#C5A059] text-[#C5A059] py-3 rounded-xl font-bold">Create Account</button>
            </div>

            <div id="userProfile" class="hidden">
                <div class="text-center mb-4">
                    <div class="w-24 h-24 mx-auto mb-2 rounded-full overflow-hidden border-4 border-[#C5A059]">
                        <img id="profileAvatar" src="" class="w-full h-full object-cover">
                    </div>
                    <input type="text" id="usernameInput" placeholder="Set Username" class="text-center bg-transparent border-b border-gray-300 dark:border-gray-700 outline-none font-bold text-lg w-full mb-1" onblur="window.saveUsername()">
                    <p id="userEmailDisplay" class="text-xs text-gray-500">email@id</p>
                </div>

                <p class="text-xs uppercase font-bold text-gray-400 mb-2">Choose Avatar</p>
                <div class="grid grid-cols-5 gap-2 mb-6" id="avatarGrid"></div>

                <button onclick="window.resetPassword()" class="w-full bg-gray-100 dark:bg-[#222] text-gray-600 dark:text-gray-300 py-3 rounded-xl font-bold mb-3 text-sm">Change Password</button>
                <button onclick="window.handleLogout()" class="w-full bg-red-500/10 text-red-500 py-3 rounded-xl font-bold text-sm">Log Out</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoCZuJ4tGdwmFuz8y-_tc5phvfbn2oi1A",
            authDomain: "ifeelav-app.firebaseapp.com",
            projectId: "ifeelav-app",
            storageBucket: "ifeelav-app.firebasestorage.app",
            messagingSenderId: "1060067685106",
            appId: "1:1060067685106:web:4ba1523ee066af4633966b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DATA & DIALOGUES ---
        const dialogues = {
            '28': ["Rishte mein toh hum tumhare baap lagte hain...", "Don't angry me!", "Action speaks louder than words.", "Ab tera kya hoga kaaliya?"],
            '35': ["Utha le re baba, utha le!", "Teja main hoon, mark idhar hai.", "Babu rao ka style hai!", "Control Uday Control!"],
            '18': ["Thappad se darr nahi lagta sahab...", "Zindagi badi honi chahiye, lambi nahi.", "Parampara, Pratishtha, Anushasan."],
            '9648': ["Kuch toh gadbad hai Daya...", "Dushman dikhai nahi deta...", "The game is afoot."],
            '10765': ["Jaadoo...", "May the force be with you.", "Reality is an illusion."]
        };
        const avatars = [
            'Male1:micah:Leo', 'Male2:avataaars:Jack', 'Fem1:adventurer:Chloe', 'Fem2:micah:Nora', 
            'Cool:adventurer:Felix', 'Angry:bottts:Grumpy', 'Happy:open-peeps:Smile', 'Rich:personas:Boss'
        ];

        let shows = [];
        let index = 0;
        let selectedLang = '';
        let currentGenre = '';
        let searchTimer;
        let searchHistory = JSON.parse(localStorage.getItem('avSearchHistory')) || [];

        // --- BACKGROUND POSTER ANIMATION ---
        async function initBackground() {
            const bg = document.getElementById('posterBg');
            const res = await fetch('https://api.themoviedb.org/3/trending/tv/week?api_key=4ba1523ee066af4633966b'); // Public key for demo
            const data = await res.json();
            const posters = data.results.slice(0, 15).map(s => `<img src="https://image.tmdb.org/t/p/w200${s.poster_path}" class="w-32 h-48 rounded-lg opacity-80">`).join('');
            bg.innerHTML = `<div class="poster-grid">${posters}${posters}</div>`; // Double for infinite scroll
        }
        initBackground();

        // --- AUTH & PROFILE ---
        window.handleLogin = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).then(() => window.toggleAuthModal()).catch(e => alert(e.message));
        window.handleSignup = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).then(() => window.toggleAuthModal()).catch(e => alert(e.message));
        window.handleLogout = () => signOut(auth);
        window.resetPassword = () => sendPasswordResetEmail(auth, auth.currentUser.email).then(() => alert("Email Sent!"));
        
        window.saveUsername = async () => {
            const newName = document.getElementById('usernameInput').value;
            if(newName && auth.currentUser) {
                await updateProfile(auth.currentUser, { displayName: newName });
                // Also save to Firestore if needed
            }
        };

        window.changeAvatar = async (seedString) => {
            const [label, style, seed] = seedString.split(':');
            const url = `https://api.dicebear.com/7.x/${style}/svg?seed=${seed}`;
            document.getElementById('profileAvatar').src = url;
            document.getElementById('headerAvatar').src = url;
            // Save to Firestore
            if(auth.currentUser) {
                const docRef = doc(db, "users", auth.currentUser.uid);
                await updateDoc(docRef, { avatar: url });
            }
        };

        // Populate Avatar Grid
        const grid = document.getElementById('avatarGrid');
        grid.innerHTML = avatars.map(a => {
            const [label, style, seed] = a.split(':');
            const url = `https://api.dicebear.com/7.x/${style}/svg?seed=${seed}`;
            return `<img src="${url}" class="w-10 h-10 rounded-full border border-gray-200 cursor-pointer hover:scale-110 transition" onclick="window.changeAvatar('${a}')" title="${label}">`;
        }).join('');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('authForms').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
                document.getElementById('usernameInput').value = user.displayName || "User";
                
                // Fetch Avatar
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                const av = docSnap.exists() && docSnap.data().avatar ? docSnap.data().avatar : `https://api.dicebear.com/7.x/notionists/svg?seed=${user.uid}`;
                document.getElementById('headerAvatar').src = av;
                document.getElementById('profileAvatar').src = av;
            } else {
                document.getElementById('authForms').classList.remove('hidden');
                document.getElementById('userProfile').classList.add('hidden');
                document.getElementById('headerAvatar').src = "https://api.dicebear.com/7.x/notionists/svg?seed=Guest";
            }
        });

        // --- NAVIGATION & GESTURES ---
        window.selectRegion = (lang, name) => {
            selectedLang = lang;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('regionTitle').innerText = name;
            history.pushState({step: 2}, "");
        };

        window.startApp = (gid) => {
            currentGenre = gid;
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('swipeStep').classList.remove('hidden');
            
            // Show Dialogue
            const genreDialogues = dialogues[gid] || ["Let the show begin!", "Grab your popcorn."];
            const randomDialogue = genreDialogues[Math.floor(Math.random() * genreDialogues.length)];
            const dbDiv = document.getElementById('dialogueBox');
            dbDiv.innerHTML = `<p class="dialogue-box italic text-gray-600 dark:text-gray-300">"${randomDialogue}"</p>`;

            fetchShows(`/api/getShows?genre=${gid}&lang=${selectedLang}`);
            history.pushState({step: 3}, "");
        };

        window.addEventListener('popstate', (e) => {
            if(!e.state) location.reload();
            if(e.state.step === 2) {
                document.getElementById('swipeStep').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            }
        });

        // --- SWIPE LOGIC (TINDER STYLE) ---
        const card = document.getElementById('showCard');
        let startX, isDragging = false;

        card.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; isDragging = true; });
        card.addEventListener('touchmove', (e) => {
            if(!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diff = currentX - startX;
            card.style.transform = `translateX(${diff}px) rotate(${diff/20}deg)`;
            
            // Show labels
            document.getElementById('like').style.opacity = diff > 0 ? diff/100 : 0;
            document.getElementById('nope').style.opacity = diff < 0 ? Math.abs(diff)/100 : 0;
        });
        card.addEventListener('touchend', (e) => {
            isDragging = false;
            const diff = e.changedTouches[0].clientX - startX;
            if(diff > 100) window.handleAction('smash');
            else if(diff < -100) window.handleAction('pass');
            else {
                card.style.transform = ''; // Reset
                document.getElementById('like').style.opacity = 0;
                document.getElementById('nope').style.opacity = 0;
            }
        });

        // --- SHOWS LOGIC ---
        async function fetchShows(url) {
            const res = await fetch(url);
            const data = await res.json();
            shows = data.results.filter(s => s.poster_path);
            index = 0;
            renderCard();
        }

        function renderCard() {
            if(!shows[index]) return;
            const s = shows[index];
            document.getElementById('cardTitle').innerText = s.name || s.original_name;
            document.getElementById('cardMeta').innerText = `⭐ ${s.vote_average.toFixed(1)} | ${s.first_air_date ? s.first_air_date.split('-')[0] : 'N/A'}`;
            document.getElementById('poster').src = `https://image.tmdb.org/t/p/w780${s.poster_path}`;
            // Reset Styles
            card.style.transform = '';
            document.getElementById('like').style.opacity = 0;
            document.getElementById('nope').style.opacity = 0;
        }

        window.handleAction = (type) => {
            card.style.transition = '0.5s';
            card.style.transform = type === 'smash' ? 'translateX(1000px) rotate(30deg)' : 'translateX(-1000px) rotate(-30deg)';
            setTimeout(() => { 
                index++; 
                card.style.transition = 'none'; // Instant reset
                card.style.transform = 'translate(0) rotate(0)'; 
                renderCard(); 
                setTimeout(() => card.style.transition = '0.3s', 10); // Re-enable transition
            }, 300);
        };

        window.openCurrentCard = () => { if(shows[index]) window.openDetails(shows[index].id); }

        // --- SEARCH HISTORY ---
        window.showHistory = () => {
            const dd = document.getElementById('searchDropdown');
            if(searchHistory.length > 0) {
                dd.innerHTML = `<div class="p-2 text-xs text-gray-400 font-bold uppercase">Recent</div>` + 
                    searchHistory.map(term => `<div class="p-3 hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer" onclick="document.getElementById('searchInput').value='${term}'; window.handleTyping({target:{value:'${term}'}})">🕒 ${term}</div>`).join('');
                dd.classList.add('active');
            }
        };

        window.handleTyping = (e) => {
            const q = e.target.value; const dd = document.getElementById('searchDropdown');
            if(q.length < 2) { dd.classList.remove('active'); return; }
            
            clearTimeout(searchTimer);
            searchTimer = setTimeout(async () => {
                const res = await fetch(`/api/getShows?query=${q}`);
                const data = await res.json();
                
                // Add to history if unique
                if(!searchHistory.includes(q) && data.results.length > 0) {
                    searchHistory.unshift(q);
                    if(searchHistory.length > 5) searchHistory.pop();
                    localStorage.setItem('avSearchHistory', JSON.stringify(searchHistory));
                }

                dd.innerHTML = data.results.slice(0, 5).map(s => `
                    <div class="p-3 border-b dark:border-zinc-800 cursor-pointer flex gap-3 items-center hover:bg-black/5" onclick="window.openDetails(${s.id})">
                        <img src="https://image.tmdb.org/t/p/w92${s.poster_path}" class="w-10 h-14 object-cover rounded">
                        <div><span class="font-bold text-sm block">${s.name || s.original_name}</span></div>
                    </div>`).join('');
                dd.classList.add('active');
            }, 300);
        };

        // --- UTILS ---
        window.toggleDarkMode = () => document.body.classList.toggle('dark');
        window.toggleAuthModal = () => document.getElementById('authModal').classList.toggle('active');
        
        // --- DETAILS ---
        window.openDetails = async (id) => {
            document.getElementById('searchDropdown').classList.remove('active');
            document.getElementById('detailOverlay').classList.add('active');
            
            const res = await fetch(`/api/getDetails?id=${id}`);
            const data = await res.json();
            
            // Fetch Streaming
            let streamHTML = '';
            try {
                const streamRes = await fetch(`/api/getStream?tmdb_id=${id}&type=tv`);
                const streamData = await streamRes.json();
                if(streamData.sources && streamData.sources.length > 0) {
                    streamHTML = streamData.sources.map(s => `<a href="${s.url}" target="_blank" class="block bg-black/5 dark:bg-white/10 p-3 rounded mb-2 border-l-4 border-gold">▶ Watch on ${s.name}</a>`).join('');
                }
            } catch(e) {}

            document.getElementById('detailContent').innerHTML = `
                <div class="h-[50vh] relative"><img src="https://image.tmdb.org/t/p/original${data.backdrop_path || data.poster_path}" class="w-full h-full object-cover"></div>
                <div class="p-6 pb-20">
                    <h1 class="brand-font text-3xl md:text-5xl gold-text">${data.name}</h1>
                    <div class="mt-4 mb-6">${streamHTML || '<p class="opacity-50 text-sm">Streaming info unavailable</p>'}</div>
                    <p class="opacity-80 leading-relaxed mb-6">${data.overview}</p>
                    <h3 class="font-bold mb-3 uppercase opacity-50 text-xs">Seasons</h3>
                    <div class="flex gap-2 overflow-x-auto">${data.seasons.map(s => `<span class="px-3 py-1 bg-gray-100 dark:bg-zinc-800 rounded text-xs font-bold whitespace-nowrap">S${s.season_number}</span>`).join('')}</div>
                </div>
            `;
            history.pushState({step: 'details'}, "");
        };

        window.closeDetails = () => { document.getElementById('detailOverlay').classList.remove('active'); history.back(); };
    </script>
</body>
</html>
