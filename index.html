<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFEELAV | Curated by Abhimanyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #C5A059; --dark-bg: #050505; }
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1a1a1a; transition: 0.3s; overflow-x: hidden; }
        body.dark { background: var(--dark-bg); color: #f5f5f5; }
        .brand-font { font-family: 'Cinzel', serif; }
        .gold-text { color: var(--gold); }
        .no-select { user-select: none; }

        /* NEW ANIMATED BACKGROUND */
        #posterBg { position: fixed; inset: 0; z-index: -1; opacity: 0.1; overflow: hidden; pointer-events: none; }
        .poster-row { display: flex; gap: 15px; width: 200%; animation: slide 40s linear infinite; margin-bottom: 15px; }
        .poster-row:nth-child(even) { animation-direction: reverse; }
        @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* COMPONENTS */
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.1); }
        body.dark .glass-panel { background: rgba(20, 20, 20, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        
        .cat-btn { background: #f5f5f5; border: 1px solid #ddd; transition: 0.3s; }
        body.dark .cat-btn { background: #111; border-color: #333; color: #ccc; }
        .cat-btn:active, .cat-btn:hover { background: var(--gold); color: white; border-color: var(--gold); transform: scale(1.05); }

        .premium-card { height: 65vh; width: 100%; max-width: 400px; border-radius: 30px; overflow: hidden; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.4); position: relative; }

        /* OVERLAYS */
        #detailOverlay, #watchlistOverlay { position: fixed; inset: 0; z-index: 100; background: white; transform: translateY(100%); transition: transform 0.3s ease-out; overflow-y: auto; }
        body.dark #detailOverlay, body.dark #watchlistOverlay { background: #080808; }
        .active-overlay { transform: translateY(0) !important; }

        /* EPISODE CARD */
        .ep-card { border-left: 3px solid transparent; transition: 0.3s; cursor: pointer; }
        .ep-card:hover { background: rgba(197, 160, 89, 0.1); border-left-color: var(--gold); }
        .ep-detail { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .ep-card.open .ep-detail { max-height: 500px; }

        /* STREAM BUTTONS */
        .stream-link { display: flex; align-items: center; gap: 8px; padding: 12px; background: #1a1a1a; color: white; border-radius: 10px; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .stream-link:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .nf { background: #E50914; } .pv { background: #00A8E1; } .hs { background: #133ba2; }
    </style>
</head>
<body class="dark"> <div id="posterBg"></div> <div class="fixed top-0 left-0 w-full z-50 p-4 flex justify-between items-center bg-white/80 dark:bg-black/80 backdrop-blur-md border-b dark:border-white/10">
        <div class="text-xl font-bold brand-font gold-text no-select cursor-pointer" onclick="location.reload()">IFEELAV</div>
        <div class="flex gap-2 items-center">
            <button onclick="window.toggleDarkMode()" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center">🌓</button>
            <div class="relative">
                <input type="text" id="searchInput" oninput="window.handleTyping(event)" placeholder="Search..." class="glass-panel rounded-full px-4 py-2 w-28 md:w-64 text-sm outline-none">
                <div id="searchDropdown" class="absolute top-full left-0 w-full bg-white dark:bg-[#111] rounded-xl shadow-xl hidden mt-2 overflow-hidden"></div>
            </div>
            <button onclick="window.toggleWatchlist()" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center relative">
                ❤️ <span id="badge" class="absolute -top-1 -right-1 bg-red-500 text-[10px] text-white w-4 h-4 rounded-full hidden flex items-center justify-center">0</span>
            </button>
        </div>
    </div>

    <div id="mainContent" class="relative z-10 min-h-screen flex flex-col items-center justify-center pt-20 px-4 pb-20">
        
        <div id="step1" class="text-center w-full max-w-4xl fade-in">
            <h1 class="brand-font text-5xl md:text-8xl gold-text mb-4 no-select tracking-tighter">IFEELAV</h1>
            <p class="text-xs text-gray-500 mb-10 uppercase tracking-[0.3em]">Curated by Abhimanyu</p>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="window.selectRegion('hi', 'Bollywood')" class="cat-btn p-6 rounded-2xl font-bold">BOLLYWOOD</button>
                <button onclick="window.selectRegion('en', 'Hollywood')" class="cat-btn p-6 rounded-2xl font-bold">HOLLYWOOD</button>
                <button onclick="window.selectRegion('ja', 'Anime')" class="cat-btn p-6 rounded-2xl font-bold">ANIME</button>
                <button onclick="window.selectRegion('ko', 'K-Drama')" class="cat-btn p-6 rounded-2xl font-bold">K-DRAMA</button>
            </div>
        </div>

        <div id="step2" class="hidden text-center w-full max-w-3xl fade-in">
            <h1 id="regionTitle" class="brand-font text-3xl gold-text mb-2"></h1>
            <div id="dialogueBox" class="h-12 mb-6 flex items-center justify-center italic text-sm opacity-70"></div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <button onclick="window.startApp('28')" class="glass-panel p-4 rounded-xl font-bold">Action</button>
                <button onclick="window.startApp('35')" class="glass-panel p-4 rounded-xl font-bold">Comedy</button>
                <button onclick="window.startApp('18')" class="glass-panel p-4 rounded-xl font-bold">Drama</button>
                <button onclick="window.startApp('9648')" class="glass-panel p-4 rounded-xl font-bold">Mystery</button>
                <button onclick="window.startApp('10765')" class="glass-panel p-4 rounded-xl font-bold">Sci-Fi</button>
            </div>
            <button onclick="location.reload()" class="text-xs uppercase tracking-widest opacity-50">Reset</button>
        </div>

        <div id="swipeStep" class="hidden w-full flex flex-col items-center">
            <div id="showCard" onclick="window.openCurrentDetails()" class="premium-card relative bg-black">
                <img id="poster" src="" class="w-full h-full object-cover pointer-events-none">
                <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black via-black/80 to-transparent">
                    <h2 id="cardTitle" class="brand-font text-3xl leading-none mb-2 text-white"></h2>
                    <p id="cardMeta" class="text-xs text-gray-300 font-sans"></p>
                    <p class="text-[10px] mt-2 text-[#C5A059] uppercase tracking-widest animate-pulse">Tap for Episodes</p>
                </div>
            </div>
            <div class="flex gap-8 mt-8">
                <button onclick="window.handleAction('pass')" class="w-16 h-16 rounded-full glass-panel flex items-center justify-center text-2xl text-red-500">✕</button>
                <button onclick="window.handleAction('smash')" class="w-16 h-16 rounded-full bg-[#C5A059] text-white text-3xl shadow-xl">♥</button>
            </div>
        </div>
    </div>

    <div id="watchlistOverlay">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="brand-font text-3xl gold-text">My Vault</h2>
                <button onclick="window.toggleWatchlist()" class="text-2xl">✕</button>
            </div>
            
            <div class="flex gap-2 mb-6">
                <input type="text" id="newPlaylistName" placeholder="New Playlist Name" class="glass-panel px-4 py-2 rounded-lg w-full text-sm outline-none">
                <button onclick="window.createPlaylist()" class="bg-[#C5A059] text-white px-4 rounded-lg font-bold">+</button>
            </div>

            <div id="playlistsContainer" class="space-y-6">
                </div>
        </div>
    </div>

    <div id="detailOverlay">
        <button onclick="window.closeDetails()" class="fixed top-6 right-6 z-[110] bg-black/50 text-white w-10 h-10 rounded-full flex items-center justify-center backdrop-blur">✕</button>
        <div id="detailContent"></div>
    </div>

    <div class="fixed bottom-6 left-0 w-full text-center pointer-events-none z-40">
        <a href="https://www.instagram.com/axviixv?igsh=MTFpZHF2Znh5ZHBhag==" target="_blank" class="pointer-events-auto inline-flex items-center gap-2 bg-black/60 backdrop-blur px-4 py-2 rounded-full text-xs text-gray-300 hover:text-[#C5A059] transition">
            <i class="fab fa-instagram"></i> Abhimanyu
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAoCZuJ4tGdwmFuz8y-_tc5phvfbn2oi1A",
            authDomain: "ifeelav-app.firebaseapp.com",
            projectId: "ifeelav-app",
            storageBucket: "ifeelav-app.firebasestorage.app",
            messagingSenderId: "1060067685106",
            appId: "1:1060067685106:web:4ba1523ee066af4633966b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- DATA ---
        const dialogues = {
            hi: { 
                '28': "Rishte mein toh hum tumhare baap lagte hain... (Shahenshah)", 
                '35': "Utha le re baba! (Hera Pheri)", 
                '18': "Thappad se darr nahi lagta sahab... (Dabangg)",
                '9648': "Kuch toh gadbad hai Daya! (CID)",
                '10765': "Jaadoo... (Koi Mil Gaya)"
            },
            en: {
                '28': "I'll be back. (Terminator)",
                '35': "Why so serious? (Dark Knight)",
                '18': "I'm gonna make him an offer he can't refuse. (Godfather)",
                '9648': "Elementary, my dear Watson. (Sherlock)",
                '10765': "May the Force be with you. (Star Wars)"
            }
        };

        // --- STATE ---
        let shows = [], index = 0, selectedLang = 'en', currentGenre = '', playlists = { 'Favorites': [] };

        // --- INIT ANIMATION ---
        async function initBg() {
            const res = await fetch('https://api.themoviedb.org/3/trending/all/week?api_key=4ba1523ee066af4633966b');
            const data = await res.json();
            const posters = data.results.map(p => `<img src="https://image.tmdb.org/t/p/w200${p.poster_path}" class="w-24 h-36 rounded-lg opacity-40 grayscale hover:grayscale-0 transition duration-500">`).join('');
            document.getElementById('posterBg').innerHTML = `
                <div class="poster-row">${posters}${posters}</div>
                <div class="poster-row">${posters}${posters}</div>
                <div class="poster-row">${posters}${posters}</div>
            `;
        }
        initBg();

        // --- NAVIGATION ---
        window.selectRegion = (lang, name) => {
            selectedLang = lang;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('regionTitle').innerText = name;
        };

        window.startApp = (gid) => {
            currentGenre = gid;
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('swipeStep').classList.remove('hidden');
            
            // Dialogue Logic
            const langKey = (selectedLang === 'hi') ? 'hi' : 'en';
            const d = dialogues[langKey][gid] || "Enjoy the show!";
            document.getElementById('dialogueBox').innerText = `"${d}"`;

            fetchShows(`/api/getShows?genre=${gid}&lang=${selectedLang}`);
        };

        async function fetchShows(url) {
            const res = await fetch(url);
            const data = await res.json();
            shows = data.results.filter(s => s.poster_path);
            index = 0;
            renderCard();
        }

        function renderCard() {
            if(!shows[index]) { alert("End of list! Refreshing..."); location.reload(); return; }
            const s = shows[index];
            document.getElementById('cardTitle').innerText = s.name || s.title || s.original_name;
            document.getElementById('cardMeta').innerText = `⭐ ${s.vote_average.toFixed(1)} | ${s.first_air_date ? s.first_air_date.split('-')[0] : 'N/A'}`;
            document.getElementById('poster').src = `https://image.tmdb.org/t/p/w780${s.poster_path}`;
        }

        window.handleAction = (type) => {
            if(type === 'smash') window.addToWatchlist(shows[index]);
            index++; renderCard();
        };

        // --- WATCHLIST & PLAYLISTS ---
        window.toggleWatchlist = () => {
            document.getElementById('watchlistOverlay').classList.toggle('active-overlay');
            renderPlaylists();
        };

        window.createPlaylist = () => {
            const name = document.getElementById('newPlaylistName').value;
            if(name && !playlists[name]) {
                playlists[name] = [];
                renderPlaylists();
                document.getElementById('newPlaylistName').value = '';
            }
        };

        window.addToWatchlist = (show) => {
            // Default to Favorites for now
            if(!playlists['Favorites'].some(s => s.id === show.id)) {
                playlists['Favorites'].push(show);
                document.getElementById('badge').innerText = playlists['Favorites'].length;
                document.getElementById('badge').classList.remove('hidden');
                alert("Added to Favorites!");
            }
        };

        function renderPlaylists() {
            const container = document.getElementById('playlistsContainer');
            container.innerHTML = Object.keys(playlists).map(key => `
                <div class="glass-panel p-4 rounded-xl">
                    <h3 class="font-bold gold-text mb-3 text-lg">${key} <span class="text-xs text-gray-500">(${playlists[key].length})</span></h3>
                    <div class="flex gap-3 overflow-x-auto pb-2">
                        ${playlists[key].length === 0 ? '<p class="text-xs opacity-50">Empty</p>' : 
                          playlists[key].map(s => `
                            <div onclick="window.openDetails(${s.id})" class="shrink-0 w-20 cursor-pointer">
                                <img src="https://image.tmdb.org/t/p/w200${s.poster_path}" class="rounded-lg mb-1">
                                <p class="text-[10px] truncate">${s.name || s.title}</p>
                            </div>
                          `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // --- DETAILS & EPISODES ---
        window.openCurrentDetails = () => window.openDetails(shows[index].id);

        window.openDetails = async (id) => {
            document.getElementById('detailOverlay').classList.add('active-overlay');
            
            // 1. Details
            const res = await fetch(`/api/getDetails?id=${id}`);
            const data = await res.json();
            
            // 2. Streaming Links
            let linksHTML = '';
            try {
                const streamRes = await fetch(`/api/getStream?tmdb_id=${id}&type=tv`);
                const sData = await streamRes.json();
                if(sData.sources) {
                    linksHTML = sData.sources.map(src => {
                        let cls = 'bg-gray-800';
                        if(src.name.includes('Netflix')) cls = 'nf';
                        if(src.name.includes('Prime')) cls = 'pv';
                        if(src.name.includes('Hotstar')) cls = 'hs';
                        return `<a href="${src.url}" target="_blank" class="stream-link ${cls}">▶ Watch on ${src.name}</a>`;
                    }).join('');
                }
            } catch(e) {}

            document.getElementById('detailContent').innerHTML = `
                <div class="h-[50vh] relative"><img src="https://image.tmdb.org/t/p/original${data.backdrop_path || data.poster_path}" class="w-full h-full object-cover">
                <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black to-transparent"><h1 class="brand-font text-4xl gold-text">${data.name}</h1></div></div>
                <div class="p-6 pb-20">
                    ${linksHTML ? `<div class="mb-6">${linksHTML}</div>` : ''}
                    <p class="opacity-80 leading-relaxed mb-8">${data.overview}</p>
                    
                    <h3 class="font-bold mb-4 text-xs uppercase opacity-50 tracking-widest">Episodes (Season 1)</h3>
                    <div id="episodesList" class="space-y-3">Loading episodes...</div>
                </div>
            `;

            // 3. Episodes with Toggle
            const epRes = await fetch(`/api/getEpisodes?id=${id}&season=1`);
            const epData = await epRes.json();
            if(epData.episodes) {
                document.getElementById('episodesList').innerHTML = epData.episodes.map(e => `
                    <div class="ep-card glass-panel p-4 rounded-xl" onclick="this.classList.toggle('open')">
                        <div class="flex justify-between items-center">
                            <span class="gold-text font-bold">E${e.episode_number}</span>
                            <span class="font-bold text-sm flex-1 ml-4">${e.name}</span>
                            <span class="text-xs bg-gray-500/20 px-2 rounded">⭐ ${e.vote_average.toFixed(1)}</span>
                        </div>
                        <div class="ep-detail mt-2 opacity-70 text-xs">
                            <img src="https://image.tmdb.org/t/p/w500${e.still_path}" class="w-full rounded-lg mb-2 mt-2" onerror="this.style.display='none'">
                            <p>${e.overview || 'No summary available.'}</p>
                        </div>
                    </div>
                `).join('');
            }
        };

        window.closeDetails = () => document.getElementById('detailOverlay').classList.remove('active-overlay');
        window.toggleDarkMode = () => document.body.classList.toggle('dark');
        
        window.handleTyping = (e) => {
            const q = e.target.value; const dd = document.getElementById('searchDropdown');
            if(q.length < 2) { dd.style.display = 'none'; return; }
            setTimeout(async () => {
                const res = await fetch(`/api/getShows?query=${q}`);
                const data = await res.json();
                dd.style.display = 'block';
                dd.innerHTML = data.results.slice(0,5).map(s => `
                    <div class="p-3 border-b dark:border-white/10 flex gap-3 cursor-pointer hover:bg-white/5" onclick="window.openDetails(${s.id})">
                        <img src="https://image.tmdb.org/t/p/w92${s.poster_path}" class="w-10 h-14 object-cover rounded">
                        <div><p class="font-bold text-sm">${s.name || s.title}</p><p class="text-xs opacity-50">${s.first_air_date?.split('-')[0] || ''}</p></div>
                    </div>`).join('');
            }, 500);
        };
    </script>
</body>
</html>
