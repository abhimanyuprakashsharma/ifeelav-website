<head>
    <meta charset="UTF-8">
    
    <!-- 🔥 AUTO RESPONSIVE VIEWPORT (ALL DEVICES) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    
    <title>IFEELAV | Curated by Abhimanyu</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --gold: #C5A059; 
            --dark-bg: #050505; 
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #ffffff; 
            color: #1a1a1a; 
            transition: 0.3s;
            min-height: 100vh;
        }

        body.dark { 
            background: var(--dark-bg); 
            color: #f5f5f5; 
        }

        /* 🔥 AUTO RESPONSIVE TYPOGRAPHY (ALL SCREENS) */
        h1 {
            font-size: clamp(28px, 6vw, 80px);
        }

        h2 {
            font-size: clamp(18px, 3vw, 34px);
        }

        p {
            font-size: clamp(14px, 1.5vw, 18px);
        }

        .brand-font { 
            font-family: 'Cinzel', serif; 
        }

        .gold-text { 
            color: var(--gold); 
        }

        /* 🔥 MAIN CONTAINER AUTO RESOLUTION */
        #mainContent {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding-left: clamp(12px, 4vw, 40px);
            padding-right: clamp(12px, 4vw, 40px);
        }

        /* 🔥 HERO SLIDER (AUTO DEVICE HEIGHT) */
        .hero-slider { 
            position: relative; 
            width: 100%; 
            height: clamp(300px, 60vh, 720px); /* AUTO HEIGHT */
            border-radius: clamp(16px, 3vw, 30px); 
            overflow: hidden; 
        }

        .hero-slide { 
            position: absolute; 
            inset: 0; 
            opacity: 0; 
            transition: opacity 0.8s ease; 
        }

        .hero-slide.active { 
            opacity: 1; 
        }

        .hero-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(
                to top, 
                rgba(0,0,0,0.85), 
                rgba(0,0,0,0.2)
            ); 
        }

        /* 🔥 OTT ROW (NETFLIX STYLE RESPONSIVE) */
        .ott-row { 
            margin-top: clamp(24px, 5vw, 60px); 
            width: 100%;
        }

        .ott-scroll { 
            display: flex; 
            gap: clamp(10px, 2vw, 20px); 
            overflow-x: auto; 
            padding: 10px 0;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .ott-scroll::-webkit-scrollbar { 
            display: none; 
        }

        /* 🔥 POSTER CARDS AUTO SIZE (PHONE → 4K) */
        .poster-card { 
            min-width: clamp(120px, 18vw, 220px);
            border-radius: clamp(12px, 2vw, 18px); 
            overflow: hidden; 
            transition: 0.3s; 
            cursor: pointer; 
            flex-shrink: 0;
            scroll-snap-align: start;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .poster-card:hover { 
            transform: scale(1.08); 
        }

        .poster-card img {
            width: 100%;
            height: clamp(180px, 28vw, 340px);
            object-fit: cover;
        }

        /* 🔥 NAVBAR RESPONSIVE */
        .navbar-container {
            padding-left: clamp(12px, 4vw, 40px);
            padding-right: clamp(12px, 4vw, 40px);
        }

        /* 🔥 GLASS PANEL RESPONSIVE */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(0,0,0,0.08); 
            border-radius: clamp(12px, 2vw, 20px);
        }

        body.dark .glass-panel { 
            background: rgba(20, 20, 20, 0.92); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            color: white; 
        }

        /* 🔥 BUTTON RESPONSIVE */
        .cta-button {
            padding: clamp(10px, 1.5vw, 16px) clamp(20px, 3vw, 40px);
            font-size: clamp(14px, 1.5vw, 18px);
            border-radius: 999px;
        }

        /* 🔥 MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            .hero-slider {
                height: 42vh;
            }

            .poster-card:hover {
                transform: none; /* disable zoom on mobile */
            }
        }

        /* 🔥 ULTRA WIDE SCREEN (4K FIX) */
        @media (min-width: 1800px) {
            #mainContent {
                max-width: 1700px;
            }
        }
    </style>
</head>
