<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>IFEELAV | Curated by Abhimanyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #C5A059; --bg-dark: #000000; }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: #fff; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .brand-font { font-family: 'Cinzel', serif; }
        .gold-text { color: var(--gold); }
        .no-select { user-select: none; }

        /* BANNER FIX FOR MOBILE */
        .hero-banner-container {
            position: relative;
            width: 100%;
            /* Mobile: Aspect Ratio 2/3 (Poster style) or 16/9 depending on pref */
            height: 50vh; 
        }
        @media (min-width: 768px) {
            .hero-banner-container { height: 70vh; }
        }

        /* HERO SLIDER */
        .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease-in-out; }
        .hero-slide.active { opacity: 1; }
        .hero-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(to top, black 10%, transparent); z-index: 10; }

        /* ROWS */
        .row-container { padding: 15px 0 15px 15px; }
        .row-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; color: #e5e5e5; border-left: 3px solid var(--gold); padding-left: 10px; }
        .row-scroll { display: flex; gap: 10px; overflow-x: auto; padding-right: 20px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .row-scroll::-webkit-scrollbar { display: none; }
        
        .poster-card { 
            flex: 0 0 auto; width: 130px; height: 195px; 
            border-radius: 8px; overflow: hidden; 
            transition: transform 0.2s ease; cursor: pointer; position: relative;
            background: #222;
        }
        .poster-card:active { transform: scale(0.95); }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; }

        /* MODALS */
        #detailOverlay, #authModal { 
            position: fixed; inset: 0; z-index: 100; 
            background: #000; display: none; overflow-y: auto;
        }
        #detailOverlay.active, #authModal.active { display: block; }
        
        #authModal { background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        
        /* SEARCH */
        #searchDropdown { position: absolute; top: 100%; right: 0; width: 100%; background: #111; border: 1px solid #333; border-radius: 8px; z-index: 60; display: none; max-height: 60vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="fixed top-0 w-full z-50 flex justify-between items-center px-4 py-3 bg-gradient-to-b from-black/90 to-transparent">
        <div class="text-xl font-bold brand-font gold-text cursor-pointer" onclick="location.reload()">IFEELAV</div>
        <div class="flex items-center gap-3">
            <div class="relative">
                <input type="text" id="searchInput" oninput="window.handleTyping(event)" placeholder="Search..." class="bg-black/50 border border-white/30 rounded-full px-3 py-1 text-xs focus:border-gold outline-none w-24 md:w-64 transition-all focus:w-32 md:focus:w-72 text-white">
                <div id="searchDropdown"></div>
            </div>
            <button onclick="window.toggleAuthModal()" class="w-8 h-8 rounded-full overflow-hidden border border-white/50">
                <img id="navAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Guest" class="w-full h-full object-cover">
            </button>
        </div>
    </div>

    <div id="heroSlider" class="hero-banner-container">
        </div>

    <div class="relative z-10 pb-20 bg-black">
        <div class="row-container">
            <h2 class="row-title">Trending Now 🔥</h2>
            <div id="trendingRow" class="row-scroll"></div>
        </div>
        <div class="row-container">
            <h2 class="row-title">Hollywood Action 🎬</h2>
            <div id="hollywoodRow" class="row-scroll"></div>
        </div>
        <div class="row-container">
            <h2 class="row-title">Bollywood Hits 🇮🇳</h2>
            <div id="bollywoodRow" class="row-scroll"></div>
        </div>
        <div class="row-container">
            <h2 class="row-title">Anime World 🇯🇵</h2>
            <div id="animeRow" class="row-scroll"></div>
        </div>
        <div class="row-container">
            <h2 class="row-title">K-Drama ❤️</h2>
            <div id="kdramaRow" class="row-scroll"></div>
        </div>
    </div>

    <div class="text-center pb-8 text-xs text-gray-500 uppercase tracking-widest bg-black">
        Curated by Abhimanyu | <a href="https://instagram.com/axviixv" target="_blank" class="hover:text-gold">Instagram</a>
    </div>

    <div id="detailOverlay">
        <button onclick="window.closeDetails()" class="fixed top-4 right-4 z-[110] bg-black/50 text-white w-10 h-10 rounded-full flex items-center justify-center backdrop-blur text-xl border border-white/20">✕</button>
        <div id="detailContent"></div>
    </div>

    <div id="authModal" class="flex items-center justify-center p-4">
        <div class="bg-[#181818] p-6 rounded-2xl w-full max-w-sm border border-[#333] relative mt-20">
            <button onclick="window.toggleAuthModal()" class="absolute top-4 right-4 text-gray-400">✕</button>
            
            <div id="authForms">
                <h2 class="text-2xl mb-6 font-bold text-center gold-text">Sign In</h2>
                <input type="email" id="email" placeholder="Email Address" class="w-full p-3 mb-4 bg-[#333] rounded text-white outline-none border border-transparent focus:border-gold">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 bg-[#333] rounded text-white outline-none border border-transparent focus:border-gold">
                <button onclick="window.handleLogin()" class="w-full bg-[#C5A059] text-black font-bold py-3 rounded hover:bg-white transition">Sign In</button>
                <button onclick="window.handleSignup()" class="w-full mt-4 py-2 border border-white/20 rounded text-sm text-gray-400 hover:text-white hover:border-white">Create Account</button>
            </div>

            <div id="userProfile" class="hidden text-center">
                <img id="profileAvatar" src="" class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-gold">
                <h3 id="userEmail" class="text-lg font-bold mb-6">User</h3>
                <button onclick="window.handleLogout()" class="w-full bg-red-900/50 text-red-200 py-2 rounded font-bold border border-red-800">Sign Out</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoCZuJ4tGdwmFuz8y-_tc5phvfbn2oi1A",
            authDomain: "ifeelav-app.firebaseapp.com",
            projectId: "ifeelav-app",
            storageBucket: "ifeelav-app.firebasestorage.app",
            messagingSenderId: "1060067685106",
            appId: "1:1060067685106:web:4ba1523ee066af4633966b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- AUTH ---
        window.toggleAuthModal = () => document.getElementById('authModal').classList.toggle('active');
        
        window.handleLogin = () => {
            const e = document.getElementById('email').value.trim(); // TRIM FIX
            const p = document.getElementById('password').value;
            if(!e || !p) { alert("Please enter details"); return; }
            signInWithEmailAndPassword(auth, e, p).then(()=>window.toggleAuthModal()).catch(err=>alert(err.message));
        };

        window.handleSignup = () => {
            const e = document.getElementById('email').value.trim(); // TRIM FIX
            const p = document.getElementById('password').value;
            if(!e || !p) { alert("Please enter details"); return; }
            createUserWithEmailAndPassword(auth, e, p).then(()=>window.toggleAuthModal()).catch(err=>alert(err.message));
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if(user){
                document.getElementById('authForms').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('userEmail').innerText = user.email.split('@')[0];
                const av = `https://api.dicebear.com/7.x/adventurer/svg?seed=${user.uid}`;
                document.getElementById('navAvatar').src = av;
                document.getElementById('profileAvatar').src = av;
            } else {
                document.getElementById('authForms').classList.remove('hidden');
                document.getElementById('userProfile').classList.add('hidden');
                document.getElementById('navAvatar').src = "https://api.dicebear.com/7.x/adventurer/svg?seed=Guest";
            }
        });

        // --- FETCH LOGIC ---
        async function fetchRow(url, elementId) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                const container = document.getElementById(elementId);
                const items = data.results || [];
                
                container.innerHTML = items.map(item => `
                    <div class="poster-card" onclick="window.openDetails(${item.id})">
                        <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" loading="lazy">
                    </div>
                `).join('');
                return items;
            } catch(e) { console.error(e); }
        }

        async function initApp() {
            const trending = await fetchRow('/api/getShows?query=', 'trendingRow');
            if(trending && trending.length > 0) initHero(trending);

            fetchRow('/api/getShows?lang=en&genre=10759', 'hollywoodRow');
            fetchRow('/api/getShows?lang=hi', 'bollywoodRow');
            fetchRow('/api/getShows?lang=ja&genre=16', 'animeRow');
            fetchRow('/api/getShows?lang=ko', 'kdramaRow');
        }

        function initHero(items) {
            const container = document.getElementById('heroSlider');
            container.innerHTML = items.slice(0, 5).map((item, index) => `
                <div class="hero-slide ${index === 0 ? 'active' : ''}">
                    <img src="https://image.tmdb.org/t/p/original${item.backdrop_path || item.poster_path}" class="w-full h-full object-cover opacity-70">
                    <div class="hero-content">
                        <h1 class="text-3xl md:text-5xl font-bold mb-2 brand-font gold-text drop-shadow-lg">${item.name || item.original_name}</h1>
                        <p class="text-xs md:text-base text-gray-200 line-clamp-2 mb-4 drop-shadow-md max-w-lg">${item.overview}</p>
                        <button onclick="window.openDetails(${item.id})" class="bg-white text-black px-6 py-2 rounded font-bold hover:bg-gold transition text-sm md:text-base shadow-lg">Play Now</button>
                    </div>
                </div>
            `).join('');

            let current = 0;
            setInterval(() => {
                const slides = document.querySelectorAll('.hero-slide');
                if(slides.length) {
                    slides[current].classList.remove('active');
                    current = (current + 1) % slides.length;
                    slides[current].classList.add('active');
                }
            }, 5000);
        }

        // --- DETAILS (Mobile Optimized) ---
        window.openDetails = async (id) => {
            const overlay = document.getElementById('detailOverlay');
            const content = document.getElementById('detailContent');
            overlay.classList.add('active');
            content.innerHTML = '<div class="flex h-screen items-center justify-center text-gold">Loading...</div>';

            try {
                const res = await fetch(`/api/getDetails?id=${id}`);
                const data = await res.json();
                
                // MOBILE HERO FIX: Use Poster if on mobile, Backdrop if on Desktop
                const isMobile = window.innerWidth < 768;
                const heroImage = isMobile ? data.poster_path : (data.backdrop_path || data.poster_path);

                let streamHTML = '';
                try {
                    const sRes = await fetch(`/api/getStream?tmdb_id=${id}&type=tv`);
                    const sData = await sRes.json();
                    if(sData.sources?.length) streamHTML = sData.sources.map(s => `<span class="px-2 py-1 bg-gray-800 border border-gray-600 rounded text-[10px] whitespace-nowrap">${s.name}</span>`).join(' ');
                    else streamHTML = '<span class="text-[10px] text-gray-500">Check local listings</span>';
                } catch(e) {}

                content.innerHTML = `
                    <div class="relative w-full" style="height: 50vh;"> <img src="https://image.tmdb.org/t/p/original${heroImage}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                        <div class="absolute bottom-0 p-6 w-full">
                            <h1 class="text-3xl md:text-5xl font-bold mb-2 gold-text brand-font leading-tight drop-shadow-xl">${data.name}</h1>
                            <div class="flex gap-3 text-xs font-bold text-gray-300 mb-3 items-center">
                                <span class="text-green-400">★ ${data.vote_average.toFixed(1)}</span>
                                <span>${data.first_air_date?.split('-')[0]}</span>
                                <span class="border border-gray-500 px-1 rounded text-[10px]">HD</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-6 pb-20 max-w-4xl mx-auto bg-black min-h-[50vh]">
                        <div class="flex flex-wrap gap-2 mb-6 overflow-x-auto no-scrollbar">${streamHTML}</div>
                        
                        <p class="text-sm md:text-lg leading-relaxed text-gray-300 mb-8 font-light">${data.overview}</p>
                        
                        <div class="mb-8">
                            <h3 class="text-lg font-bold mb-4 gold-text border-l-4 border-gold pl-3">Seasons</h3>
                            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                ${data.seasons?.filter(s=>s.season_number>0).map(s => 
                                    `<button onclick="window.loadEpisodes(${id}, ${s.season_number})" class="px-4 py-2 bg-[#222] rounded-lg text-xs font-bold border border-transparent hover:border-gold whitespace-nowrap transition">Season ${s.season_number}</button>`
                                ).join('') || '<p class="text-xs text-gray-500">No Seasons Info</p>'}
                            </div>
                        </div>

                        <div id="episodeList" class="space-y-3"></div>
                    </div>
                `;

                if(data.seasons?.length > 0) window.loadEpisodes(id, 1);

            } catch(e) { content.innerHTML = '<p class="text-center mt-20 text-red-500">Error loading content.</p>'; }
        };

        window.loadEpisodes = async (id, s) => {
            const list = document.getElementById('episodeList');
            list.innerHTML = '<p class="text-xs opacity-50">Loading episodes...</p>';
            try {
                const res = await fetch(`/api/getEpisodes?id=${id}&season=${s}`);
                const data = await res.json();
                list.innerHTML = data.episodes.map(e => `
                    <div class="flex items-start gap-3 p-3 bg-[#111] rounded border border-white/5">
                        <div class="text-lg font-bold text-gray-600 w-6 shrink-0">${e.episode_number}</div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <h4 class="font-bold text-gray-200 text-sm">${e.name}</h4>
                                <span class="text-[10px] text-gray-500">${e.runtime ? e.runtime+'m' : ''}</span>
                            </div>
                            <p class="text-[10px] text-gray-400 line-clamp-2 leading-relaxed">${e.overview || 'No description available.'}</p>
                        </div>
                    </div>
                `).join('');
            } catch(e) { list.innerHTML = '<p class="text-xs text-red-500">Episode info unavailable</p>'; }
        }

        window.closeDetails = () => document.getElementById('detailOverlay').classList.remove('active');

        // --- SEARCH ---
        window.handleTyping = (e) => {
            const q = e.target.value.trim();
            const dd = document.getElementById('searchDropdown');
            if(q.length < 2) { dd.style.display = 'none'; return; }
            
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(async () => {
                const res = await fetch(`/api/getShows?query=${q}`);
                const data = await res.json();
                dd.style.display = 'block';
                dd.innerHTML = data.results.slice(0,5).map(s => `
                    <div class="flex items-center gap-3 p-3 hover:bg-gray-800 cursor-pointer border-b border-gray-700 transition" onclick="window.openDetails(${s.id})">
                        <img src="https://image.tmdb.org/t/p/w92${s.poster_path}" class="w-8 h-12 object-cover rounded">
                        <span class="text-xs font-bold text-gray-300 line-clamp-1">${s.name || s.original_name}</span>
                    </div>
                `).join('');
            }, 300);
        }

        initApp();
    </script>
</body>
</html>
