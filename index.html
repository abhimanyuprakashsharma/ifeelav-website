<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>IFEELAV | Curated by Abhimanyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #C5A059; --bg-dark: #141414; }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: #fff; overflow-x: hidden; }
        .brand-font { font-family: 'Cinzel', serif; }
        .gold-text { color: var(--gold); }
        .no-select { user-select: none; }

        /* HERO SLIDER */
        .hero-container { position: relative; height: 70vh; width: 100%; mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }
        .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease-in-out; }
        .hero-slide.active { opacity: 1; }
        .hero-content { position: absolute; bottom: 20%; left: 5%; max-width: 600px; z-index: 10; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }

        /* ROWS */
        .row-container { padding: 20px 0 20px 20px; }
        .row-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; color: #e5e5e5; border-left: 3px solid var(--gold); padding-left: 10px; }
        .row-scroll { display: flex; gap: 12px; overflow-x: auto; padding-right: 20px; scroll-behavior: smooth; }
        .row-scroll::-webkit-scrollbar { display: none; } 
        
        .poster-card { 
            flex: 0 0 auto; width: 140px; height: 210px; 
            border-radius: 8px; overflow: hidden; 
            transition: transform 0.3s ease; cursor: pointer;
            position: relative;
        }
        .poster-card:hover { transform: scale(1.1); z-index: 5; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; }

        /* MODALS */
        #detailOverlay, #authModal { 
            position: fixed; inset: 0; z-index: 100; 
            background: rgba(0,0,0,0.95); backdrop-filter: blur(5px);
            display: none; overflow-y: auto;
        }
        #detailOverlay.active, #authModal.active { display: block; }
        
        /* SEARCH DROPDOWN */
        #searchDropdown { position: absolute; top: 100%; right: 0; width: 250px; background: #222; border: 1px solid #444; border-radius: 8px; z-index: 60; display: none; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-gradient-to-b from-black/90 to-transparent">
        <div class="text-2xl font-bold brand-font gold-text cursor-pointer" onclick="location.reload()">IFEELAV</div>
        <div class="flex items-center gap-4">
            <div class="relative">
                <input type="text" id="searchInput" oninput="window.handleTyping(event)" placeholder="Search..." class="bg-black/50 border border-white/30 rounded-full px-3 py-1 text-sm focus:border-gold outline-none w-32 md:w-64 transition-all focus:w-40 md:focus:w-72">
                <div id="searchDropdown"></div>
            </div>
            <button onclick="window.toggleAuthModal()" class="w-8 h-8 rounded-full overflow-hidden border border-white/50">
                <img id="navAvatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Guest" class="w-full h-full object-cover">
            </button>
        </div>
    </div>

    <div id="heroSlider" class="hero-container">
        </div>

    <div class="relative z-10 -mt-20 pb-20">
        <div class="row-container">
            <h2 class="row-title">Trending Now 🔥</h2>
            <div id="trendingRow" class="row-scroll"></div>
        </div>
        <div class="row-container">
            <h2 class="row-title">Hollywood Action 🎬</h2>
            <div id="hollywoodRow" class="row-scroll"></div>
        </div>
        <div class="row-container">
            <h2 class="row-title">Bollywood Hits 🇮🇳</h2>
            <div id="bollywoodRow" class="row-scroll"></div>
        </div>
        <div class="row-container">
            <h2 class="row-title">Anime World 🇯🇵</h2>
            <div id="animeRow" class="row-scroll"></div>
        </div>
        <div class="row-container">
            <h2 class="row-title">K-Drama ❤️</h2>
            <div id="kdramaRow" class="row-scroll"></div>
        </div>
    </div>

    <div class="text-center pb-8 text-xs text-gray-500 uppercase tracking-widest">
        Curated by Abhimanyu | <a href="https://instagram.com/axviixv" target="_blank" class="hover:text-gold">Instagram</a>
    </div>

    <div id="detailOverlay">
        <button onclick="window.closeDetails()" class="fixed top-6 right-6 z-[110] bg-white/10 text-white w-10 h-10 rounded-full flex items-center justify-center backdrop-blur text-xl hover:bg-red-600 transition">✕</button>
        <div id="detailContent"></div>
    </div>

    <div id="authModal">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-[#181818] p-8 rounded-2xl w-full max-w-sm border border-[#333] relative">
                <button onclick="window.toggleAuthModal()" class="absolute top-4 right-4 text-gray-400">✕</button>
                
                <div id="authForms">
                    <h2 class="text-2xl mb-6 font-bold text-center gold-text">Sign In</h2>
                    <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-4 bg-[#333] rounded text-white outline-none">
                    <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 bg-[#333] rounded text-white outline-none">
                    <button onclick="window.handleLogin()" class="w-full bg-[#C5A059] text-black font-bold py-3 rounded hover:bg-white transition">Sign In</button>
                    <button onclick="window.handleSignup()" class="w-full mt-3 text-sm text-gray-400 hover:text-white">New to IFEELAV? Sign up now.</button>
                </div>

                <div id="userProfile" class="hidden text-center">
                    <img id="profileAvatar" src="" class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-gold">
                    <h3 id="userEmail" class="text-lg font-bold mb-6">User</h3>
                    <button onclick="window.handleLogout()" class="w-full bg-red-600 py-2 rounded font-bold">Sign Out</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoCZuJ4tGdwmFuz8y-_tc5phvfbn2oi1A",
            authDomain: "ifeelav-app.firebaseapp.com",
            projectId: "ifeelav-app",
            storageBucket: "ifeelav-app.firebasestorage.app",
            messagingSenderId: "1060067685106",
            appId: "1:1060067685106:web:4ba1523ee066af4633966b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- AUTH ---
        window.toggleAuthModal = () => document.getElementById('authModal').classList.toggle('active');
        window.handleLogin = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).then(()=>window.toggleAuthModal()).catch(e=>alert(e.message));
        window.handleSignup = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).then(()=>window.toggleAuthModal()).catch(e=>alert(e.message));
        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if(user){
                document.getElementById('authForms').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('userEmail').innerText = user.email.split('@')[0];
                const av = `https://api.dicebear.com/7.x/adventurer/svg?seed=${user.uid}`;
                document.getElementById('navAvatar').src = av;
                document.getElementById('profileAvatar').src = av;
            } else {
                document.getElementById('authForms').classList.remove('hidden');
                document.getElementById('userProfile').classList.add('hidden');
                document.getElementById('navAvatar').src = "https://api.dicebear.com/7.x/adventurer/svg?seed=Guest";
            }
        });

        // --- FETCH LOGIC ---
        async function fetchRow(url, elementId) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                const container = document.getElementById(elementId);
                const items = data.results || [];
                
                container.innerHTML = items.map(item => `
                    <div class="poster-card" onclick="window.openDetails(${item.id})">
                        <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" loading="lazy">
                    </div>
                `).join('');
                return items;
            } catch(e) { console.error(e); }
        }

        // --- INIT HERO & ROWS ---
        async function initApp() {
            // 1. Trending
            const trending = await fetchRow('/api/getShows?query=', 'trendingRow');
            if(trending && trending.length > 0) initHero(trending);

            // 2. Hollywood Action (TV Genre: 10759, NOT 28)
            fetchRow('/api/getShows?lang=en&genre=10759', 'hollywoodRow');
            
            // 3. Bollywood (Generic Hindi)
            fetchRow('/api/getShows?lang=hi', 'bollywoodRow');
            
            // 4. Anime (Genre 16)
            fetchRow('/api/getShows?lang=ja&genre=16', 'animeRow');
            
            // 5. K-Drama
            fetchRow('/api/getShows?lang=ko', 'kdramaRow');
        }

        function initHero(items) {
            const container = document.getElementById('heroSlider');
            container.innerHTML = items.slice(0, 5).map((item, index) => `
                <div class="hero-slide ${index === 0 ? 'active' : ''}">
                    <img src="https://image.tmdb.org/t/p/original${item.backdrop_path || item.poster_path}" class="w-full h-full object-cover opacity-60">
                    <div class="hero-content">
                        <h1 class="text-4xl md:text-6xl font-bold mb-4 brand-font gold-text">${item.name || item.original_name}</h1>
                        <p class="text-sm md:text-lg text-gray-200 line-clamp-3 mb-6">${item.overview}</p>
                        <button onclick="window.openDetails(${item.id})" class="bg-white text-black px-8 py-3 rounded font-bold hover:bg-gold transition">Play Now</button>
                    </div>
                </div>
            `).join('');

            let current = 0;
            setInterval(() => {
                const slides = document.querySelectorAll('.hero-slide');
                slides[current].classList.remove('active');
                current = (current + 1) % slides.length;
                slides[current].classList.add('active');
            }, 5000);
        }

        // --- DETAILS ---
        window.openDetails = async (id) => {
            const overlay = document.getElementById('detailOverlay');
            const content = document.getElementById('detailContent');
            overlay.classList.add('active');
            content.innerHTML = '<div class="flex h-screen items-center justify-center text-gold">Loading Details...</div>';

            try {
                const res = await fetch(`/api/getDetails?id=${id}`);
                const data = await res.json();

                let streamHTML = '';
                try {
                    const sRes = await fetch(`/api/getStream?tmdb_id=${id}&type=tv`);
                    const sData = await sRes.json();
                    if(sData.sources?.length) streamHTML = sData.sources.map(s => `<span class="px-3 py-1 bg-gray-800 border border-gray-600 rounded text-xs">${s.name}</span>`).join(' ');
                    else streamHTML = '<span class="text-xs text-gray-500">Check local listings</span>';
                } catch(e) {}

                content.innerHTML = `
                    <div class="relative h-[60vh]">
                        <img src="https://image.tmdb.org/t/p/original${data.backdrop_path || data.poster_path}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#000] via-black/40 to-transparent"></div>
                        <div class="absolute bottom-0 p-8 w-full">
                            <h1 class="text-4xl md:text-6xl font-bold mb-2 gold-text brand-font">${data.name}</h1>
                            <div class="flex gap-4 text-sm font-bold text-gray-300 mb-4">
                                <span class="text-green-400">${data.vote_average.toFixed(1)} Match</span>
                                <span>${data.first_air_date?.split('-')[0]}</span>
                                <span class="border border-gray-500 px-1 rounded text-xs p-0.5">HD</span>
                            </div>
                            <div class="flex flex-wrap gap-2 mb-4">${streamHTML}</div>
                        </div>
                    </div>
                    <div class="p-8 max-w-5xl mx-auto">
                        <div class="grid md:grid-cols-3 gap-8">
                            <div class="md:col-span-2">
                                <p class="text-lg leading-relaxed text-gray-300 mb-8">${data.overview}</p>
                                <h3 class="text-xl font-bold mb-4 border-l-4 border-gold pl-3">Episodes</h3>
                                <div id="episodeList" class="space-y-3"></div>
                            </div>
                            <div class="space-y-4 text-sm text-gray-400">
                                <p><span class="text-gray-500">Genres:</span> ${data.genres.map(g=>g.name).join(', ')}</p>
                                <p><span class="text-gray-500">Seasons:</span> ${data.number_of_seasons}</p>
                            </div>
                        </div>
                    </div>
                `;
                if(data.seasons?.length > 0) window.loadEpisodes(id, 1);
            } catch(e) { content.innerHTML = '<p class="text-center mt-20 text-red-500">Error loading content.</p>'; }
        };

        window.loadEpisodes = async (id, s) => {
            const list = document.getElementById('episodeList');
            list.innerHTML = '<p class="text-sm opacity-50">Loading episodes...</p>';
            try {
                const res = await fetch(`/api/getEpisodes?id=${id}&season=${s}`);
                const data = await res.json();
                list.innerHTML = data.episodes.map(e => `
                    <div class="flex items-center gap-4 p-3 hover:bg-gray-800 rounded transition border-b border-gray-800">
                        <div class="text-xl font-bold text-gray-500 w-8">${e.episode_number}</div>
                        <div class="flex-1">
                            <div class="flex justify-between"><h4 class="font-bold text-white">${e.name}</h4><span class="text-xs text-gray-400">${e.runtime ? e.runtime+'m' : ''}</span></div>
                            <p class="text-xs text-gray-400 line-clamp-2 mt-1">${e.overview || 'No description'}</p>
                        </div>
                    </div>
                `).join('');
            } catch(e) { list.innerHTML = '<p class="text-xs">Episode info unavailable</p>'; }
        }

        window.closeDetails = () => document.getElementById('detailOverlay').classList.remove('active');

        // --- SEARCH ---
        window.handleTyping = (e) => {
            const q = e.target.value; const dd = document.getElementById('searchDropdown');
            if(q.length < 2) { dd.style.display = 'none'; return; }
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(async () => {
                const res = await fetch(`/api/getShows?query=${q}`);
                const data = await res.json();
                dd.style.display = 'block';
                dd.innerHTML = data.results.slice(0,5).map(s => `
                    <div class="flex items-center gap-3 p-3 hover:bg-gray-700 cursor-pointer border-b border-gray-700" onclick="window.openDetails(${s.id})">
                        <img src="https://image.tmdb.org/t/p/w92${s.poster_path}" class="w-10 h-14 object-cover rounded">
                        <span class="text-sm font-bold text-gray-200">${s.name || s.original_name}</span>
                    </div>
                `).join('');
            }, 300);
        }

        initApp();
    </script>
</body>
</html>
